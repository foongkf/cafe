<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="FEONG的咖啡馆收藏集 · 我的私藏咖啡馆清单">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --text:#2c2320;
    --muted:#8a7a6d;
    --accent:#a8683c;
    --accent-soft:#f7ede4;
    --border:#ece1d6;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
    min-height:100vh;
  }
  body.no-scroll{overflow:hidden;}

  /* ---------- 顶部 ---------- */
  .app-header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(250,247,242,.88);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .logo{font-size:24px;line-height:1;flex:0 0 auto;}
  .brand-text{min-width:0;}
  .brand-text h1{
    font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sub{font-size:12px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hdr-btn{
    flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;
    border:1px solid var(--border);background:#fff;color:var(--text);
    border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:500;
    font-family:inherit;cursor:pointer;transition:background .15s;
  }
  .hdr-btn:active{background:#f3ece5;}
  .hdr-btn.spin{opacity:.55;pointer-events:none;}

  /* ---------- 工具栏 ---------- */
  .toolbar{
    max-width:1200px;margin:0 auto;
    padding:14px 16px 4px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .search{flex:1 1 240px;min-width:0;position:relative;display:flex;align-items:center;}
  .search .ico{position:absolute;left:13px;font-size:14px;opacity:.45;pointer-events:none;line-height:1;}
  .search input{
    width:100%;min-width:0;
    padding:11px 14px 11px 38px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fff;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;
  }
  .search input::placeholder{color:#b6a698;}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn-random{
    flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;
    min-height:44px;
    padding:11px 17px;border-radius:12px;border:none;
    background:var(--accent);color:#fff;
    font-size:14.5px;font-weight:600;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    transition:opacity .15s, transform .1s;
    box-shadow:0 2px 8px rgba(168,104,60,.22);
  }
  .btn-random:active{opacity:.86;transform:scale(.98);}

  /* ---------- 视图切换条 ---------- */
  .viewbar{
    max-width:1200px;margin:0 auto;
    padding:10px 16px 12px;
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  }
  .seg{
    display:inline-flex;gap:3px;padding:3px;
    background:#fff;border:1px solid var(--border);border-radius:14px;
  }
  .seg-btn{
    border:none;background:none;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:13.5px;font-weight:600;color:#6b5b4e;
    padding:10px 16px;min-height:44px;line-height:1;
    border-radius:11px;cursor:pointer;
    transition:background .15s,color .15s;
    -webkit-appearance:none;
  }
  .seg-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(168,104,60,.22);}
  .seg-btn:active{opacity:.85;}

  .chip{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 16px;min-height:44px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#fff;
    color:#6b5b4e;
    font-size:13.5px;
    font-family:inherit;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    line-height:1;
    transition:all .15s;
  }
  .chip:active{transform:scale(.97);}
  .chip.active{
    background:#e0574a;border-color:#e0574a;color:#fff;
    box-shadow:0 2px 8px rgba(224,87,74,.25);
  }

  /* ---------- 分组 ---------- */
  .groups{
    max-width:1200px;margin:0 auto;
    padding:0 16px 32px;
  }
  .group{margin-bottom:8px;}
  .group-head{
    display:flex;align-items:center;gap:10px;
    width:100%;min-height:44px;
    background:none;border:none;font-family:inherit;color:var(--text);
    padding:10px 2px;
    cursor:pointer;text-align:left;
    -webkit-appearance:none;
  }
  .group-head:active{opacity:.68;}
  .g-arrow{
    flex:0 0 auto;
    display:inline-block;
    font-size:17px;line-height:1;color:var(--muted);
    transition:transform .24s ease;
  }
  .group.open .g-arrow{transform:rotate(90deg);}
  .g-title{
    font-size:16.5px;font-weight:650;letter-spacing:.1px;
    word-break:break-word;min-width:0;
  }
  .g-count{
    flex:0 0 auto;
    font-size:11.5px;line-height:1;color:var(--muted);
    background:#fff;border:1px solid var(--border);
    padding:4px 9px;border-radius:999px;
  }
  .group-body{
    overflow:hidden;
    transition:max-height .3s ease, opacity .24s ease;
  }
  .group-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(258px, 1fr));
    gap:14px;
    padding-bottom:2px;
  }
  .more-btn{
    display:block;width:100%;
    margin-top:12px;
    padding:11px 14px;min-height:44px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--accent);
    font-family:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .more-btn:hover{background:#fdf9f5;border-color:#dccbb9;}
  .more-btn:active{background:#f7ede4;}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 16px 14px;
    display:flex;flex-direction:column;gap:9px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(90,60,35,.04);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
    -webkit-user-select:none;user-select:none;
  }
  .card.is-hidden{display:none;}
  @media (hover:hover){
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(120,80,50,.11);border-color:#e3d5c6;}
  }
  .card:active{transform:scale(.988);}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .card-title{font-size:16px;font-weight:650;margin:0;line-height:1.35;letter-spacing:.1px;word-break:break-word;}
  .fav-btn{
    flex:0 0 auto;
    background:none;border:none;padding:1px 3px;
    font-size:19px;line-height:1;cursor:pointer;
    color:#d9c9bb;font-family:inherit;
    transition:transform .14s, color .14s;
  }
  .fav-btn.on{color:#e0574a;}
  .fav-btn:active{transform:scale(1.22);}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;line-height:1;
    padding:5px 9px;border-radius:999px;
    white-space:nowrap;
  }
  .tag-area{background:#eef3ee;color:#4f6b4f;}
  .tag-cat{background:var(--accent-soft);color:#8a5a34;}
  .card-desc{
    margin:0;font-size:13.5px;line-height:1.6;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .pill-xhs{
    align-self:flex-start;
    font-size:12.5px;font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    padding:6px 11px;border-radius:9px;
    text-decoration:none;
    transition:background .15s;
  }
  .pill-xhs:hover{background:#f0e0d2;}

  /* ---------- 状态 ---------- */
  .state{
    text-align:center;
    padding:64px 20px;
    color:var(--muted);
    font-size:15px;
    line-height:1.9;
  }
  .state .big{font-size:34px;display:block;margin-bottom:10px;}
  .state button{
    margin-top:14px;
    padding:10px 22px;border-radius:11px;border:none;
    background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;
    font-family:inherit;cursor:pointer;min-height:44px;
  }
  .loading-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent);margin-right:8px;
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  /* ---------- 底部 ---------- */
  .footer{
    text-align:center;
    padding:0 16px calc(34px + env(safe-area-inset-bottom));
    color:#b9aa9c;font-size:12.5px;line-height:1.7;
  }

  /* ---------- 下拉刷新指示器 ---------- */
  .ptr{
    position:fixed;left:0;right:0;top:0;z-index:60;
    padding-top:env(safe-area-inset-top);
    display:flex;justify-content:center;
    pointer-events:none;
    transform:translateY(-100%);
    transition:transform .25s ease;
  }
  .ptr-pill{
    display:inline-flex;align-items:center;gap:7px;
    margin-top:8px;
    background:#fffdfa;
    border:1px solid var(--border);
    color:var(--muted);
    font-size:12.5px;font-weight:500;
    padding:8px 15px;border-radius:999px;
    box-shadow:0 4px 16px rgba(90,60,35,.14);
    white-space:nowrap;
  }
  .ptr-ico{display:inline-block;font-size:13px;line-height:1;transition:transform .2s;}
  .ptr.ready .ptr-ico{transform:rotate(180deg);}
  .ptr.loading .ptr-ico{animation:ptrspin .8s linear infinite;}
  @keyframes ptrspin{to{transform:rotate(360deg);}}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;}
  .modal.open{display:flex;align-items:flex-end;justify-content:center;}
  .modal-backdrop{
    position:absolute;inset:0;
    background:rgba(45,28,16,.48);
    -webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);
    animation:fadeIn .2s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-panel{
    position:relative;
    width:100%;max-width:600px;
    background:#fffdfa;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    animation:slideUp .26s cubic-bezier(.2,.85,.3,1);
    box-shadow:0 -8px 40px rgba(60,35,15,.18);
  }
  @keyframes slideUp{from{transform:translateY(28px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:700px){
    .modal.open{align-items:center;}
    .modal-panel{border-radius:20px;max-height:82vh;animation:popIn .22s ease;}
    @keyframes popIn{from{transform:scale(.96);opacity:.5;}to{transform:scale(1);opacity:1;}}
  }
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .m-head h2{font-size:21px;font-weight:700;margin:0 0 9px;line-height:1.35;word-break:break-word;}
  .icon-btn{
    flex:0 0 auto;
    width:44px;height:44px;border-radius:50%;
    border:1px solid var(--border);background:#fff;color:#8a7a6d;
    font-size:15px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:#f3ece5;}
  .m-desc{
    font-size:15px;line-height:1.8;color:#4e4239;
    margin:16px 0 0;
    white-space:pre-wrap;word-break:break-word;
  }
  .m-desc.muted{color:var(--muted);font-style:italic;}
  .m-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 18px;border-radius:13px;min-height:44px;
    font-size:15px;font-weight:600;font-family:inherit;
    border:1px solid transparent;cursor:pointer;text-decoration:none;
    flex:1 1 auto;min-width:130px;
    transition:opacity .15s, background .15s;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(168,104,60,.25);}
  .btn-primary:active{opacity:.87;}
  .btn-ghost{background:#fff;border-color:var(--border);color:var(--text);}
  .btn-ghost.on{color:#e0574a;border-color:#f3cfca;background:#fdf3f2;}
  .btn-ghost:active{background:#f7f1ea;}

  /* ---------- 移动端微调 ---------- */
  @media (max-width:520px){
    .brand-text h1{font-size:15.5px;}
    .logo{font-size:21px;}
    .hdr-btn{padding:8px 11px;font-size:13px;}
    .groups{padding:0 12px 28px;}
    .group-grid{grid-template-columns:1fr;gap:12px;}
    .toolbar{padding:12px 12px 2px;}
    .viewbar{padding:10px 12px 12px;}
    .app-header{padding-left:12px;padding-right:12px;}
    .btn-random{flex:1 1 100%;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">☕</span>
    <div class="brand-text">
      <h1>FEONG的咖啡馆收藏集</h1>
      <p class="sub" id="countText">正在载入…</p>
    </div>
  </div>
  <button class="hdr-btn" id="refreshBtn" type="button">↻ 刷新</button>
</header>

<div class="ptr" id="ptr" aria-hidden="true">
  <span class="ptr-pill">
    <span class="ptr-ico">↓</span>
    <span class="ptr-txt">下拉刷新</span>
  </span>
</div>

<div class="toolbar">
  <div class="search">
    <span class="ico">🔍</span>
    <input id="searchInput" type="search" placeholder="搜索名字、地区、分类或描述…" autocomplete="off" enterkeyhint="search">
  </div>
  <button class="btn-random" id="randomBtn" type="button">🎲 随机挑一间</button>
</div>

<div class="viewbar">
  <div class="seg" id="seg" role="group" aria-label="分组方式">
    <button type="button" class="seg-btn active" data-view="category">按分类</button>
    <button type="button" class="seg-btn" data-view="area">按地区</button>
  </div>
  <button type="button" class="chip" id="favChip">❤ 收藏</button>
</div>

<main class="groups" id="groups"></main>

<footer class="footer">
  数据来自 Google Sheet，打开页面即自动同步最新内容<br>
  © FEONG 的私人咖啡馆清单
</footer>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';

  var PROXIES = [
    function (u) { return u; },
    function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); }
  ];

  var FAV_KEY = 'feong_cafe_favs_v1';
  var PREVIEW = 4;         // 每组默认预览卡片数
  var PTR_THRESHOLD = 70;  // 下拉刷新触发阈值（阻尼后 px）
  var PTR_DAMP = 0.5;      // 阻尼系数

  /* ================= 状态 ================= */
  var state = {
    all: [],
    view: [],
    viewMode: 'category',   // 'category' | 'area'
    onlyFav: false,
    q: '',
    loading: true,
    error: ''
  };
  var favs = loadFavs();
  var collapsed = {};   // "viewMode|groupKey" -> true
  var expanded = {};    // "viewMode|groupKey" -> true
  var currentId = null;
  var lastLoad = Date.now();

  /* ================= DOM ================= */
  var groupsEl   = document.getElementById('groups');
  var countEl    = document.getElementById('countText');
  var searchEl   = document.getElementById('searchInput');
  var randomBtn  = document.getElementById('randomBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var segEl      = document.getElementById('seg');
  var favChip    = document.getElementById('favChip');
  var modalEl    = document.getElementById('modal');
  var modalPanel = document.getElementById('modalPanel');
  var ptrEl      = document.getElementById('ptr');
  var ptrTxt     = ptrEl ? ptrEl.querySelector('.ptr-txt') : null;

  /* ================= 工具函数 ================= */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeKey(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/[\s\u3000_\-—–:：·.。/\\()（）\[\]]/g, '');
  }

  function normalizeUrl(u) {
    u = String(u == null ? '' : u).trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^(www\.|xhslink\.|xiaohongshu\.|m\.xiaohongshu\.)/i.test(u)) return 'https://' + u;
    if (/\.(com|cn|net|org|me|cc|link)\b/i.test(u)) return 'https://' + u;
    return '';
  }

  /* ================= 本地收藏 ================= */
  function loadFavs() {
    try {
      var raw = localStorage.getItem(FAV_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
      return new Set();
    }
  }
  function saveFavs() {
    try {
      localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs)));
    } catch (e) { /* 隐私模式忽略 */ }
  }

  /* ================= CSV 解析 ================= */
  function parseCSV(text) {
    text = String(text || '').replace(/^\uFEFF/, '');
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQ = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') { inQ = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r') { /* 跳过 */ }
        else { field += c; }
      }
    }
    row.push(field);
    if (row.length > 1 || String(row[0]).trim() !== '') rows.push(row);
    return rows;
  }

  /* ================= 数据组装 ================= */
  function findCol(headers, keys) {
    for (var i = 0; i < headers.length; i++) {
      for (var j = 0; j < keys.length; j++) {
        if (headers[i] === keys[j] || headers[i].indexOf(keys[j]) !== -1) return i;
      }
    }
    return -1;
  }

  function buildItems(rows) {
    if (!rows || !rows.length) return [];

    var firstRowText = rows[0].join('|').toLowerCase();
    var headerWords = ['名字','名称','店名','地区','区域','分类','类别','描述','简介','小红书','链接',
                       'name','area','location','category','description','desc','url','link','note','remark'];
    var hasHeader = false;
    for (var w = 0; w < headerWords.length; w++) {
      if (firstRowText.indexOf(headerWords[w]) !== -1) { hasHeader = true; break; }
    }

    var DEF = { name: 0, area: 1, url: 2, cat: 3, desc: 4 };
    var col, dataRows;

    if (hasHeader) {
      var h = rows[0].map(normalizeKey);
      col = {
        name: findCol(h, ['名字','名称','店名','cafe名','name','title']),
        area: findCol(h, ['地区','区域','地点','位置','area','location','region','district']),
        url:  findCol(h, ['小红书链接','小红书','链接','网址','xhs','xiaohongshu','link','url']),
        cat:  findCol(h, ['分类','类别','类型','category','type','tag']),
        desc: findCol(h, ['描述','简介','介绍','备注','说明','description','desc','note','remark'])
      };
      for (var k in DEF) {
        if (col[k] < 0) col[k] = DEF[k];
      }
      dataRows = rows.slice(1);
    } else {
      col = DEF;
      dataRows = rows;
    }

    var items = [];
    dataRows.forEach(function (r) {
      var get = function (idx) {
        return (idx >= 0 && idx < r.length) ? String(r[idx] == null ? '' : r[idx]).trim() : '';
      };
      var name = get(col.name);
      if (!name) return;

      var area = get(col.area);
      var category = get(col.cat) || '其它';
      var desc = get(col.desc);
      var url = normalizeUrl(get(col.url));

      items.push({
        id: (name + '|' + area).toLowerCase(),
        name: name,
        area: area,
        category: category,
        categoryKey: category.toLowerCase(),
        desc: desc,
        url: url
      });
    });

    return items;
  }

  /* ================= 网络请求 ================= */
  function fetchWithTimeout(url, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error('请求超时')); }, ms);
      fetch(url, { cache: 'no-store', redirect: 'follow' })
        .then(function (res) { clearTimeout(timer); resolve(res); })
        .catch(function (err) { clearTimeout(timer); reject(err); });
    });
  }

  function fetchCSVText() {
    var lastErr = null;
    var chain = Promise.reject();

    PROXIES.forEach(function (make) {
      chain = chain.catch(function () {
        var url = make(CSV_URL);
        return fetchWithTimeout(url, 15000).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        }).then(function (text) {
          if (!text || text.trim().length < 5) throw new Error('返回内容为空');
          if (text.trim().charAt(0) === '<') throw new Error('返回的不是 CSV 数据');
          return text;
        }).catch(function (err) {
          lastErr = err;
          throw err;
        });
      });
    });

    return chain.catch(function () {
      throw new Error((lastErr && lastErr.message) ? lastErr.message : '网络请求失败');
    });
  }

  /* ================= 分组 ================= */
  function buildGroups() {
    var useArea = state.viewMode === 'area';
    var map = {}, list = [];

    state.view.forEach(function (it) {
      var label = useArea ? (it.area || '未标注地区') : (it.category || '其它');
      var k = label.toLowerCase();
      if (!map[k]) {
        map[k] = { key: k, label: label, items: [] };
        list.push(map[k]);
      }
      map[k].items.push(it);
    });

    list.sort(function (a, b) {
      return a.label.localeCompare(b.label, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' });
    });

    return list;
  }

  function gkey(section) {
    return state.viewMode + '|' + section.getAttribute('data-key');
  }

  /* ================= 折叠动画 ================= */
  function applyOpen(section, open, animate) {
    var body = section.querySelector('.group-body');
    var head = section.querySelector('.group-head');
    if (!body || !head) return;

    section.classList.toggle('open', open);
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    clearTimeout(body._tid);

    if (!animate) {
      body.style.transition = 'none';
      body.style.maxHeight = open ? 'none' : '0px';
      body.style.opacity = open ? '1' : '0';
      void body.offsetHeight;
      body.style.transition = '';
      return;
    }

    if (open) {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.style.opacity = '1';
      body._tid = setTimeout(function () {
        if (section.classList.contains('open')) body.style.maxHeight = 'none';
      }, 320);
    } else {
      body.style.maxHeight = body.scrollHeight + 'px';
      body.style.opacity = '1';
      void body.offsetHeight;
      body.style.maxHeight = '0px';
      body.style.opacity = '0';
    }
  }

  function refreshBodyHeight(section) {
    if (!section.classList.contains('open')) return;
    var body = section.querySelector('.group-body');
    body.style.maxHeight = body.scrollHeight + 'px';
    clearTimeout(body._tid);
    body._tid = setTimeout(function () {
      if (section.classList.contains('open')) body.style.maxHeight = 'none';
    }, 320);
  }

  /* ================= 渲染：卡片 ================= */
  function cardHTML(it, hidden) {
    var isFav = favs.has(it.id);
    var h = '<article class="card' + (hidden ? ' is-hidden' : '') + '" data-id="' + esc(it.id) + '">';

    h += '<div class="card-head">';
    h += '<h3 class="card-title">' + esc(it.name) + '</h3>';
    h += '<button type="button" class="fav-btn' + (isFav ? ' on' : '') +
         '" data-fav="' + esc(it.id) + '" aria-label="收藏">' + (isFav ? '♥' : '♡') + '</button>';
    h += '</div>';

    if (it.area || it.category) {
      h += '<div class="tags">';
      if (it.area) h += '<span class="tag tag-area">📍 ' + esc(it.area) + '</span>';
      if (it.category) h += '<span class="tag tag-cat">' + esc(it.category) + '</span>';
      h += '</div>';
    }

    if (it.desc) h += '<p class="card-desc">' + esc(it.desc) + '</p>';
    if (it.url) {
      h += '<a class="pill-xhs" href="' + esc(it.url) +
           '" target="_blank" rel="noopener noreferrer">小红书 ↗</a>';
    }

    h += '</article>';
    return h;
  }

  /* ================= 渲染：分组 ================= */
  function groupHTML(g) {
    var key = state.viewMode + '|' + g.key;
    var open = !collapsed[key];
    var wide = !!expanded[key];
    var n = g.items.length;

    var h = '<section class="group' + (open ? ' open' : '') + '" data-key="' + esc(g.key) + '">';

    h += '<button class="group-head" type="button" aria-expanded="' + (open ? 'true' : 'false') + '">';
    h += '<span class="g-arrow" aria-hidden="true">›</span>';
    h += '<span class="g-title">' + esc(g.label) + '</span>';
    h += '<span class="g-count">' + n + '</span>';
    h += '</button>';

    h += '<div class="group-body"><div class="group-grid">';
    for (var i = 0; i < n; i++) {
      h += cardHTML(g.items[i], !wide && i >= PREVIEW);
    }
    h += '</div>';

    if (n > PREVIEW) {
      h += '<button class="more-btn" type="button" data-more="1">' +
           (wide ? '收起' : '展开全部 · 共 ' + n + ' 间') + '</button>';
    }

    h += '</div></section>';
    return h;
  }

  function render() {
    if (state.loading) {
      groupsEl.innerHTML = '<div class="state"><span class="loading-dot"></span>正在读取咖啡馆收藏…</div>';
      updateCount();
      return;
    }

    if (state.error) {
      groupsEl.innerHTML =
        '<div class="state"><span class="big">😵</span>读取失败：' + esc(state.error) +
        '<br><span style="font-size:13px">请检查网络，或确认 Google Sheet 已发布为 CSV</span>' +
        '<br><button type="button" id="retryBtn">重新加载</button></div>';
      updateCount();
      return;
    }

    if (!state.view.length) {
      var msg = state.onlyFav ? '你还没有收藏任何咖啡馆'
              : (state.all.length ? '没有找到符合条件的咖啡馆 🥲' : '表格里还没有数据');
      groupsEl.innerHTML = '<div class="state"><span class="big">☕</span>' + esc(msg) + '</div>';
      updateCount();
      return;
    }

    var groups = buildGroups();
    var html = '';
    for (var i = 0; i < groups.length; i++) html += groupHTML(groups[i]);
    groupsEl.innerHTML = html;

    var secs = groupsEl.querySelectorAll('.group');
    for (var j = 0; j < secs.length; j++) {
      applyOpen(secs[j], !collapsed[gkey(secs[j])], false);
    }

    updateCount();
  }

  function updateCount() {
    if (state.loading) {
      countEl.textContent = '正在载入…';
    } else if (state.error) {
      countEl.textContent = '载入失败';
    } else if (state.view.length === state.all.length) {
      countEl.textContent = '共收藏 ' + state.all.length + ' 间咖啡馆';
    } else {
      countEl.textContent = '显示 ' + state.view.length + ' / ' + state.all.length + ' 间';
    }
  }

  /* ================= 筛选 ================= */
  function applyFilter() {
    var q = state.q.trim().toLowerCase();

    state.view = state.all.filter(function (it) {
      if (state.onlyFav && !favs.has(it.id)) return false;
      if (q) {
        var hay = (it.name + ' ' + it.area + ' ' + it.category + ' ' + it.desc).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    render();
  }

  /* ================= 弹窗 ================= */
  function modalHTML(it) {
    var isFav = favs.has(it.id);

    var html = '<div class="m-head"><div style="min-width:0">';
    html += '<h2>' + esc(it.name) + '</h2>';
    if (it.area || it.category) {
      html += '<div class="tags">';
      if (it.area) html += '<span class="tag tag-area">📍 ' + esc(it.area) + '</span>';
      if (it.category) html += '<span class="tag tag-cat">' + esc(it.category) + '</span>';
      html += '</div>';
    }
    html += '</div>';
    html += '<button type="button" class="icon-btn" data-close="1" aria-label="关闭">✕</button></div>';

    html += it.desc
      ? '<p class="m-desc">' + esc(it.desc) + '</p>'
      : '<p class="m-desc muted">暂无描述</p>';

    html += '<div class="m-actions">';
    if (it.url) {
      html += '<a class="btn btn-primary" href="' + esc(it.url) +
              '" target="_blank" rel="noopener noreferrer">在小红书查看 ↗</a>';
    }
    html += '<button type="button" class="btn btn-ghost' + (isFav ? ' on' : '') +
            '" data-fav="' + esc(it.id) + '">' + (isFav ? '♥ 已收藏' : '♡ 加入收藏') + '</button>';
    html += '</div>';

    return html;
  }

  function openModal(id) {
    var it = null;
    for (var i = 0; i < state.all.length; i++) {
      if (state.all[i].id === id) { it = state.all[i]; break; }
    }
    if (!it) return;

    currentId = id;
    modalPanel.innerHTML = modalHTML(it);
    modalEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    modalPanel.scrollTop = 0;
  }

  function closeModal() {
    modalEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    currentId = null;
  }

  function syncModalFav(id) {
    if (!currentId || currentId !== id) return;
    var btn = modalPanel.querySelector('[data-fav]');
    if (!btn) return;
    var isFav = favs.has(id);
    btn.classList.toggle('on', isFav);
    btn.textContent = isFav ? '♥ 已收藏' : '♡ 加入收藏';
  }

  /* ================= 收藏切换 ================= */
  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id);
    else favs.add(id);
    saveFavs();
    applyFilter();
    syncModalFav(id);
  }

  /* ================= 事件绑定 ================= */
  groupsEl.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;

    // 收藏
    var favBtn = t.closest('[data-fav]');
    if (favBtn) {
      e.preventDefault();
      e.stopPropagation();
      toggleFav(favBtn.getAttribute('data-fav'));
      return;
    }

    // 展开全部 / 收起
    var more = t.closest('[data-more]');
    if (more) {
      e.preventDefault();
      var sec = more.closest('.group');
      var k = gkey(sec);
      var willExpand = !expanded[k];
      if (willExpand) expanded[k] = true; else delete expanded[k];

      var cards = sec.querySelectorAll('.card');
      for (var i = PREVIEW; i < cards.length; i++) {
        cards[i].classList.toggle('is-hidden', !willExpand);
      }
      more.textContent = willExpand ? '收起' : '展开全部 · 共 ' + cards.length + ' 间';
      refreshBodyHeight(sec);
      return;
    }

    // 分组标题栏折叠
    var head = t.closest('.group-head');
    if (head) {
      var section = head.closest('.group');
      var key = gkey(section);
      var willOpen = !section.classList.contains('open');
      if (willOpen) delete collapsed[key]; else collapsed[key] = true;
      applyOpen(section, willOpen, true);
      return;
    }

    if (t.closest('a')) return; // 链接正常跳转

    var retry = t.closest('#retryBtn');
    if (retry) { load(); return; }

    var card = t.closest('.card');
    if (card) openModal(card.getAttribute('data-id'));
  });

  modalEl.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;

    if (t.closest('[data-close]')) { closeModal(); return; }

    var favBtn = t.closest('[data-fav]');
    if (favBtn) {
      e.preventDefault();
      toggleFav(favBtn.getAttribute('data-fav'));
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') closeModal();
  });

  // 视图切换
  segEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.seg-btn') : null;
    if (!btn) return;
    var v = btn.getAttribute('data-view');
    if (v === state.viewMode) return;
    state.viewMode = v;

    var btns = segEl.querySelectorAll('.seg-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('active', btns[i] === btn);
    }
    applyFilter();
  });

  // 收藏开关
  favChip.addEventListener('click', function () {
    state.onlyFav = !state.onlyFav;
    favChip.classList.toggle('active', state.onlyFav);
    applyFilter();
  });

  // 搜索（防抖）
  var searchTimer = null;
  searchEl.addEventListener('input', function () {
    var val = searchEl.value;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = val;
      applyFilter();
    }, 180);
  });

  // 随机
  randomBtn.addEventListener('click', function () {
    if (!state.view.length) {
      if (state.loading) return;
      alert('目前没有可挑选的咖啡馆～');
      return;
    }
    var pick = state.view[Math.floor(Math.random() * state.view.length)];
    openModal(pick.id);
  });

  // 刷新
  refreshBtn.addEventListener('click', function () { load(); });

  /* ================= 加载流程 ================= */
  function load() {
    state.loading = true;
    state.error = '';
    render();
    refreshBtn.classList.add('spin');
    refreshBtn.textContent = '↻ 同步中';

    return fetchCSVText().then(function (text) {
      state.all = buildItems(parseCSV(text));
      state.loading = false;
      lastLoad = Date.now();
      applyFilter();
    }).catch(function (err) {
      state.loading = false;
      state.error = (err && err.message) ? err.message : '未知错误';
      render();
    }).then(function () {
      refreshBtn.classList.remove('spin');
      refreshBtn.textContent = '↻ 刷新';
    });
  }

  // 页面重新可见时自动同步（超过 5 分钟）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - lastLoad > 5 * 60 * 1000 && !state.loading) {
      load();
    }
  });

  /* ================= 下拉刷新（仅 standalone） ================= */
  var standalone = window.navigator.standalone === true ||
                   (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

  if (standalone && ptrEl) {
    var ptrState = { startY: 0, dist: 0, active: false, pulling: false, busy: false };

    var ptrSetY = function (px) {
      ptrEl.style.transform = 'translateY(calc(-100% + ' + px + 'px))';
    };

    var ptrIdle = function (animate) {
      if (animate === false) {
        ptrEl.style.transition = 'none';
      }
      ptrEl.classList.remove('ready', 'loading');
      ptrEl.style.transform = 'translateY(-100%)';
      if (ptrTxt) ptrTxt.textContent = '下拉刷新';
      ptrState.dist = 0;
      ptrState.pulling = false;
      if (animate === false) {
        void ptrEl.offsetHeight;
        ptrEl.style.transition = '';
      }
    };

    document.addEventListener('touchstart', function (e) {
      if (ptrState.busy || state.loading) return;
      if (modalEl.classList.contains('open')) return;
      if (window.scrollY > 0 || document.documentElement.scrollTop > 0) return;
      if (e.touches.length !== 1) return;
      ptrState.active = true;
      ptrState.startY = e.touches[0].clientY;
      ptrState.dist = 0;
    }, { passive: true });

    document.addEventListener('touchmove', function (e) {
      if (!ptrState.active) return;
      if (e.touches.length !== 1) return;

      var dy = e.touches[0].clientY - ptrState.startY;

      if (dy <= 0) {
        if (ptrState.pulling) {
          ptrState.pulling = false;
          ptrEl.style.transition = '';
          ptrIdle(true);
        }
        return;
      }

      if (window.scrollY > 0) {
        ptrState.active = false;
        if (ptrState.pulling) { ptrState.pulling = false; ptrIdle(true); }
        return;
      }

      ptrState.dist = Math.min(dy * PTR_DAMP, 100);
      ptrState.pulling = true;

      ptrEl.style.transition = 'none';
      ptrSetY(ptrState.dist);

      var ready = ptrState.dist >= PTR_THRESHOLD;
      ptrEl.classList.toggle('ready', ready);
      if (ptrTxt) ptrTxt.textContent = ready ? '松开刷新' : '下拉刷新';
    }, { passive: true });

    document.addEventListener('touchend', function () {
      if (!ptrState.active) return;
      ptrState.active = false;

      if (ptrState.dist >= PTR_THRESHOLD && !state.loading && !ptrState.busy) {
        ptrState.busy = true;
        ptrEl.classList.remove('ready');
        ptrEl.classList.add('loading');
        if (ptrTxt) ptrTxt.textContent = '正在同步…';
        ptrEl.style.transition = 'transform .2s ease';
        ptrSetY(44);

        load().then(function () {
          ptrState.busy = false;
          ptrEl.style.transition = '';
          ptrIdle(true);
        });
      } else {
        ptrState.pulling = false;
        ptrEl.style.transition = '';
        ptrIdle(true);
      }
    }, { passive: true });

    document.addEventListener('touchcancel', function () {
      ptrState.active = false;
      ptrState.pulling = false;
      ptrState.busy = false;
      ptrEl.style.transition = '';
      ptrIdle(true);
    }, { passive: true });
  }

  /* ================= 启动 ================= */
  load();
})();
</script>
</body>
</html>
