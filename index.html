<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>FEONG的咖啡馆收藏集</title>
<meta name="description" content="FEONG 的咖啡馆收藏集 · 随时随地挑选下一家想去的咖啡馆" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#f7f2ea" />
<meta name="format-detection" content="telephone=no" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f7f2ea;
    --surface:#ffffff;
    --surface-2:#fbf7f1;
    --ink:#2f2620;
    --ink-2:#5c4c40;
    --muted:#93826f;
    --line:#e8ddcf;
    --accent:#a8642f;
    --accent-2:#c98a4b;
    --accent-soft:#f4e7d8;
    --green:#3f8f63;
    --green-soft:#e4f2e9;
    --radius:18px;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
    background-color:var(--bg);
    background-image:radial-gradient(900px 520px at 50% -240px,#fff9f0 0%,rgba(255,249,240,0) 72%);
    background-repeat:no-repeat;
    color:var(--ink);
    min-height:100vh;
    overscroll-behavior-y:none;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));
  }
  button{font-family:inherit}

  /* ---------- 顶部 ---------- */
  .app-header{
    position:sticky;top:0;z-index:40;
    padding-top:env(safe-area-inset-top,0px);
    background:rgba(247,242,234,.86);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1120px;margin:0 auto;padding:10px 16px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .logo{
    width:40px;height:40px;border-radius:14px;flex:0 0 auto;
    display:grid;place-items:center;font-size:20px;line-height:1;
    background:linear-gradient(140deg,#f8ebd9,#e8cba7);
    box-shadow:inset 0 0 0 1px rgba(168,100,47,.14);
  }
  .brand-text{min-width:0}
  .brand-text h1{
    margin:0;font-size:16.5px;line-height:1.25;font-weight:700;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .brand-text p{
    margin:2px 0 0;font-size:12px;line-height:1.25;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    width:38px;height:38px;flex:0 0 auto;
    border-radius:12px;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);font-size:17px;line-height:1;
    display:grid;place-items:center;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,transform .12s,border-color .15s;
  }
  .icon-btn:hover{background:var(--surface-2);border-color:#ddcdb9}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.spinning span{display:inline-block;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- 工具栏 ---------- */
  .toolbar{
    max-width:1120px;margin:0 auto;padding:14px 16px 2px;
    display:flex;flex-direction:column;gap:10px;
  }
  .search-wrap{position:relative}
  .search-wrap .s-ico{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    font-size:14px;opacity:.45;pointer-events:none;
  }
  #search{
    width:100%;height:42px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface);
    padding:0 16px 0 38px;font-size:15px;color:var(--ink);
    outline:none;font-family:inherit;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;appearance:none;
  }
  #search::placeholder{color:#b3a291}
  #search:focus{border-color:#d9b892;box-shadow:0 0 0 3px rgba(168,100,47,.10)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
    color:var(--ink-2);font-size:13px;font-weight:600;
    padding:7px 15px;border-radius:999px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,color .15s,border-color .15s,transform .1s;
  }
  .chip:active{transform:scale(.96)}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}

  /* ---------- 分类 ---------- */
  .cat{margin-top:16px}
  .cat:first-child{margin-top:6px}
  .cat-head{
    max-width:1120px;margin:0 auto;padding:0 16px 8px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .cat-title{
    margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;
    display:flex;align-items:center;gap:8px;color:var(--ink);
    min-width:0;
  }
  .cat-title > span:first-child{flex:0 0 auto}
  .cat-dot{
    width:9px;height:9px;border-radius:3px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent-2),var(--accent));
  }
  .cat-count{
    font-size:11.5px;font-weight:600;color:var(--accent);
    background:var(--accent-soft);border-radius:999px;padding:2px 9px;
    flex:0 0 auto;
  }
  .expand-btn{
    flex:0 0 auto;font-size:12.5px;font-weight:600;
    color:var(--accent);background:transparent;
    border:1px solid rgba(168,100,47,.28);
    padding:6px 13px;border-radius:999px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,transform .1s;
  }
  .expand-btn:hover{background:var(--accent-soft)}
  .expand-btn:active{transform:scale(.96)}

  /* ---------- 卡片轨道 ---------- */
  .rail-wrap{max-width:1120px;margin:0 auto}
  .rail{
    display:flex;align-items:stretch;gap:12px;
    overflow-x:auto;overflow-y:hidden;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    padding:4px 16px 18px;
    scrollbar-width:none;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail .card{flex:0 0 auto;width:min(76vw,290px);scroll-snap-align:start}
  .rail.expanded{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(238px,1fr));
    gap:12px;overflow:visible;padding-bottom:8px;
  }
  .rail.expanded .card{width:auto}

  /* ---------- 卡片 ---------- */
  .card{
    position:relative;display:flex;flex-direction:column;gap:9px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 13px;
    box-shadow:0 1px 2px rgba(47,38,32,.04), 0 14px 26px -22px rgba(47,38,32,.55);
    cursor:pointer;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--accent-2),var(--accent));
    opacity:0;transition:opacity .2s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:#e0d0bc;
    box-shadow:0 2px 5px rgba(47,38,32,.05), 0 22px 34px -26px rgba(47,38,32,.65);
  }
  .card:hover::before{opacity:1}
  .card:active{transform:scale(.985)}
  .card:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
  .card.visited{background:linear-gradient(180deg,#fbfdfb 0%,#ffffff 60%)}

  .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:22px}
  .pill{
    font-size:11px;font-weight:700;letter-spacing:.3px;
    color:var(--accent);background:var(--accent-soft);
    padding:3px 9px;border-radius:999px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62%;
  }
  .visited-badge{
    font-size:11px;font-weight:700;color:var(--green);
    background:var(--green-soft);border-radius:999px;padding:3px 9px;white-space:nowrap;
    flex:0 0 auto;
  }
  .card-title{
    margin:0;font-size:15.5px;font-weight:700;line-height:1.35;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
  .card-addr{
    margin:0;font-size:12.5px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
  }
  .card-desc{
    margin:0;font-size:13px;line-height:1.55;color:var(--ink-2);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden;word-break:break-word;
    flex:1 1 auto;
  }
  .card-foot{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:3px;
  }

  .btn{
    appearance:none;-webkit-appearance:none;
    display:inline-flex;align-items:center;gap:4px;
    font-size:12.5px;font-weight:600;line-height:1;
    padding:8px 13px;border-radius:999px;
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
    text-decoration:none;white-space:nowrap;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,color .15s,transform .1s;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-primary:hover{background:#955a2a;border-color:#955a2a}
  .btn-xhs{background:#fff1f2;border-color:#f7d8dc;color:#cf4059}
  .btn-xhs:hover{background:#ffe6e9}
  .btn-visit{background:var(--surface-2)}
  .btn-visit.on{background:var(--green-soft);border-color:#c3e2d0;color:var(--green)}

  /* ---------- 状态 ---------- */
  .state-box{
    max-width:1120px;margin:0 auto;padding:60px 24px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    text-align:center;color:var(--muted);font-size:14px;
  }
  .state-emoji{font-size:42px;line-height:1}
  .spinner{
    display:inline-block;width:15px;height:15px;border-radius:50%;
    border:2px solid rgba(168,100,47,.22);border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }

  /* ---------- 下拉刷新 ---------- */
  .pull-indicator{
    position:fixed;top:0;left:50%;z-index:80;
    transform:translate(-50%,-100%);
    display:flex;align-items:center;gap:8px;
    padding:9px 16px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);
    box-shadow:0 12px 26px -14px rgba(47,38,32,.45);
    font-size:13px;font-weight:600;color:var(--ink-2);
    opacity:0;pointer-events:none;will-change:transform;
    white-space:nowrap;
  }
  .pull-indicator .spinner{display:none}
  .pull-indicator.spinning .spinner{display:inline-block}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;z-index:100;
    bottom:calc(28px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,18px);
    background:rgba(47,38,32,.93);color:#fff;
    font-size:13px;padding:10px 18px;border-radius:999px;
    max-width:78vw;text-align:center;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:420px){
    .brand-text h1{font-size:15px}
    .rail .card{width:min(80vw,270px)}
  }
  @media (min-width:900px){
    .rail .card{width:300px}
  }
</style>
</head>
<body>

<!-- 下拉刷新提示 -->
<div class="pull-indicator" id="pullIndicator">
  <span class="spinner"></span>
  <span id="pullText">下拉刷新</span>
</div>

<!-- 顶栏 -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="logo">☕</div>
      <div class="brand-text">
        <h1>FEONG的咖啡馆收藏集</h1>
        <p id="subtitle">正在读取资料…</p>
      </div>
    </div>
    <button class="icon-btn" id="refreshBtn" type="button" aria-label="刷新" title="刷新">
      <span>⟳</span>
    </button>
  </div>
</header>

<!-- 工具栏 -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="s-ico">🔍</span>
    <input id="search" type="search" placeholder="搜索名字、地址、描述…" autocomplete="off" autocorrect="off" spellcheck="false" />
  </div>
  <div class="chips">
    <button class="chip active" type="button" data-filter="all">全部</button>
    <button class="chip" type="button" data-filter="todo">未去过</button>
    <button class="chip" type="button" data-filter="done">已去过</button>
  </div>
</div>

<!-- 内容 -->
<main id="content"></main>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ========================================================
     配置
     ======================================================== */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var LS_VISITED = 'feong_cafe_visited_v1';
  var LS_CACHE   = 'feong_cafe_cache_v1';
  var PULL_THRESHOLD = 64;

  /* ========================================================
     状态
     ======================================================== */
  var state = {
    items: [],
    visited: new Set(),
    query: '',
    filter: 'all',
    expanded: new Set(),
    loading: false,
    error: ''
  };

  /* ========================================================
     小工具
     ======================================================== */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }

  var toastTimer = null;
  function toast(msg){
    var t = $('#toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function setSubtitle(txt){
    var el = $('#subtitle');
    if(el) el.textContent = txt;
  }

  /* ========================================================
     CSV 解析（支持引号、逗号、换行、BOM）
     ======================================================== */
  function parseCSV(text){
    text = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;

    for(var i = 0; i < text.length; i++){
      var c = text.charAt(i);

      if(inQuotes){
        if(c === '"'){
          if(text.charAt(i + 1) === '"'){ field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if(c === '"'){
          inQuotes = true;
        } else if(c === ','){
          row.push(field); field = '';
        } else if(c === '\n'){
          row.push(field); field = '';
          rows.push(row); row = [];
        } else {
          field += c;
        }
      }
    }
    if(field.length > 0 || row.length > 0){
      row.push(field);
      rows.push(row);
    }

    // 过滤完全空白的行
    return rows.filter(function(r){
      for(var i = 0; i < r.length; i++){
        if(String(r[i] || '').trim() !== '') return true;
      }
      return false;
    });
  }

  /* ========================================================
     资料处理
     ======================================================== */
  function normalizeCat(c){
    c = String(c == null ? '' : c).trim();
    if(!c) return '其它';
    // 纯英文/数字/空格 → 统一小写，便于字母排序
    if(/^[\x20-\x7E]+$/.test(c)) return c.toLowerCase();
    return c;
  }

  function makeId(name, address){
    var s = (String(name || '') + '|' + String(address || '')).toLowerCase();
    var h = 5381;
    for(var i = 0; i < s.length; i++){
      h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    }
    return 'c' + (h >>> 0).toString(36);
  }

  function buildItems(rows){
    if(!rows || rows.length < 2) return [];

    var header = rows[0].map(function(h){
      return String(h == null ? '' : h).replace(/^\uFEFF/, '').trim().toLowerCase();
    });

    function findIdx(cands){
      var i, p;
      // 1) 精确匹配
      for(p = 0; p < cands.length; p++){
        i = header.indexOf(cands[p]);
        if(i > -1) return i;
      }
      // 2) 包含匹配
      for(p = 0; p < cands.length; p++){
        for(i = 0; i < header.length; i++){
          if(header[i] && header[i].indexOf(cands[p]) > -1) return i;
        }
      }
      return -1;
    }

    var iName = findIdx(['名字','名称','店名','咖啡馆','name','cafe name','cafename','title']);
    var iAddr = findIdx(['地址','地点','位置','address','location']);
    var iXhs  = findIdx(['小红书链接','小红书','xiaohongshu','xhs','redbook','链接','link','url']);
    var iCat  = findIdx(['分类','类别','category','type']);
    var iDesc = findIdx(['描述','简介','备注','说明','description','desc','note','notes','remark']);

    if(iName < 0) iName = 0;

    var items = [];
    for(var r = 1; r < rows.length; r++){
      var row = rows[r];
      if(!row) continue;

      var name = String(row[iName] == null ? '' : row[iName]).trim();
      if(!name) continue;

      var address = iAddr > -1 ? String(row[iAddr] == null ? '' : row[iAddr]).trim() : '';

      var xhs = iXhs > -1 ? String(row[iXhs] == null ? '' : row[iXhs]).trim() : '';
      if(xhs){
        if(/^https?:\/\//i.test(xhs)){
          // 原样使用
        } else if(/^(www\.|xhslink\.|xiaohongshu\.)/i.test(xhs)){
          xhs = 'https://' + xhs;
        } else {
          xhs = '';
        }
      }

      var category = normalizeCat(iCat > -1 ? row[iCat] : '');
      var desc = iDesc > -1 ? String(row[iDesc] == null ? '' : row[iDesc]).trim() : '';

      items.push({
        id: makeId(name, address),
        name: name,
        address: address,
        xhs: xhs,
        category: category,
        desc: desc
      });
    }
    return items;
  }

  /* ========================================================
     已去过（localStorage）
     ======================================================== */
  function loadVisited(){
    try{
      var raw = localStorage.getItem(LS_VISITED);
      var arr = raw ? JSON.parse(raw) : [];
      state.visited = new Set(Array.isArray(arr) ? arr : []);
    }catch(e){
      state.visited = new Set();
    }
  }

  function saveVisited(){
    try{
      localStorage.setItem(LS_VISITED, JSON.stringify(Array.prototype.slice.call(state.visited)));
    }catch(e){ /* 忽略 */ }
  }

  function countVisited(){
    var n = 0;
    for(var i = 0; i < state.items.length; i++){
      if(state.visited.has(state.items[i].id)) n++;
    }
    return n;
  }

  function defaultSubtitle(){
    return '共 ' + state.items.length + ' 家 · 已去过 ' + countVisited() + ' 家';
  }

  /* ========================================================
     缓存
     ======================================================== */
  function loadCache(){
    try{
      var raw = localStorage.getItem(LS_CACHE);
      if(!raw) return null;
      var obj = JSON.parse(raw);
      if(obj && Array.isArray(obj.items) && obj.items.length) return obj.items;
    }catch(e){}
    return null;
  }

  function saveCache(items){
    try{
      localStorage.setItem(LS_CACHE, JSON.stringify({ t: Date.now(), items: items }));
    }catch(e){}
  }

  /* ========================================================
     渲染
     ======================================================== */
  function cardHTML(it){
    var visited = state.visited.has(it.id);

    return '<article class="card' + (visited ? ' visited' : '') + '" data-id="' + it.id + '" tabindex="0" role="button" aria-label="' + esc(it.name) + '，点击导航">' +
      '<div class="card-head">' +
        '<span class="pill">' + esc(it.category) + '</span>' +
        (visited ? '<span class="visited-badge">✓ 已去过</span>' : '') +
      '</div>' +
      '<h3 class="card-title">' + esc(it.name) + '</h3>' +
      (it.address ? '<p class="card-addr">📍 ' + esc(it.address) + '</p>' : '') +
      (it.desc ? '<p class="card-desc">' + esc(it.desc) + '</p>' : '') +
      '<div class="card-foot">' +
        '<button class="btn btn-primary" type="button" data-act="nav">🧭 导航</button>' +
        (it.xhs ? '<a class="btn btn-xhs" data-act="xhs" href="' + esc(it.xhs) + '" target="_blank" rel="noopener noreferrer">📕 小红书</a>' : '') +
        '<button class="btn btn-visit' + (visited ? ' on' : '') + '" type="button" data-act="visited">' +
          (visited ? '✓ 已去过' : '标记去过') +
        '</button>' +
      '</div>' +
    '</article>';
  }

  function render(){
    var content = $('#content');
    if(!content) return;

    var y = window.scrollY || window.pageYOffset || 0;

    if(state.items.length){
      setSubtitle(defaultSubtitle());
    }

    // 错误且无数据
    if(state.error && !state.items.length){
      content.innerHTML =
        '<div class="state-box">' +
          '<div class="state-emoji">😿</div>' +
          '<p>' + esc(state.error) + '</p>' +
          '<button class="btn btn-primary" type="button" id="retryBtn">重新加载</button>' +
        '</div>';
      window.scrollTo(0, y);
      return;
    }

    // 加载中
    if(!state.items.length){
      content.innerHTML =
        '<div class="state-box">' +
          '<span class="spinner"></span>' +
          '<p>正在读取咖啡馆资料…</p>' +
        '</div>';
      window.scrollTo(0, y);
      return;
    }

    // 过滤
    var q = state.query.trim().toLowerCase();
    var items = state.items.filter(function(it){
      if(state.filter === 'todo' && state.visited.has(it.id)) return false;
      if(state.filter === 'done' && !state.visited.has(it.id)) return false;
      if(q){
        var hay = (it.name + ' ' + it.address + ' ' + it.desc + ' ' + it.category).toLowerCase();
        if(hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    if(!items.length){
      content.innerHTML =
        '<div class="state-box">' +
          '<div class="state-emoji">🔍</div>' +
          '<p>没有符合条件的咖啡馆</p>' +
        '</div>';
      window.scrollTo(0, y);
      return;
    }

    // 分组
    var groups = {};
    items.forEach(function(it){
      if(!groups[it.category]) groups[it.category] = [];
      groups[it.category].push(it);
    });

    // 分类按字母排序
    var cats = Object.keys(groups).sort(function(a, b){
      var x = a.toLowerCase();
      var z = b.toLowerCase();
      if(x < z) return -1;
      if(x > z) return 1;
      return 0;
    });

    var html = '';
    cats.forEach(function(cat){
      var list = groups[cat];
      var expanded = state.expanded.has(cat);

      html += '<section class="cat">' +
        '<div class="cat-head">' +
          '<h2 class="cat-title"><span class="cat-dot"></span><span>' + esc(cat) + '</span>' +
            '<span class="cat-count">' + list.length + '</span>' +
          '</h2>' +
          '<button class="expand-btn" type="button" data-cat="' + esc(cat) + '">' +
            (expanded ? '收起' : '展开全部') +
          '</button>' +
        '</div>' +
        '<div class="rail-wrap"><div class="rail' + (expanded ? ' expanded' : '') + '">' +
          list.map(cardHTML).join('') +
        '</div></div>' +
      '</section>';
    });

    content.innerHTML = html;
    window.scrollTo(0, y);
  }

  /* ========================================================
     行为
     ======================================================== */
  function navigateTo(id){
    var it = null;
    for(var i = 0; i < state.items.length; i++){
      if(state.items[i].id === id){ it = state.items[i]; break; }
    }
    if(!it) return;

    var dest = it.address || it.name;
    var url = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(dest);

    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function updateCardVisited(id, visited){
    var cards = $$('.card[data-id="' + id + '"]');
    cards.forEach(function(card){
      card.classList.toggle('visited', visited);

      var head = card.querySelector('.card-head');
      var badge = head ? head.querySelector('.visited-badge') : null;

      if(visited && head && !badge){
        badge = document.createElement('span');
        badge.className = 'visited-badge';
        badge.textContent = '✓ 已去过';
        head.appendChild(badge);
      } else if(!visited && badge && badge.parentNode){
        badge.parentNode.removeChild(badge);
      }

      var btn = card.querySelector('[data-act="visited"]');
      if(btn){
        btn.classList.toggle('on', visited);
        btn.textContent = visited ? '✓ 已去过' : '标记去过';
      }
    });
  }

  function toggleVisited(id){
    if(state.visited.has(id)) state.visited.delete(id);
    else state.visited.add(id);
    saveVisited();

    var nowVisited = state.visited.has(id);
    toast(nowVisited ? '已标记为「已去过」' : '已取消「已去过」标记');

    if(state.filter === 'all'){
      updateCardVisited(id, nowVisited);
      setSubtitle(defaultSubtitle());
    } else {
      render();
    }
  }

  /* ========================================================
     载入数据
     ======================================================== */
  function loadData(force){
    if(state.loading) return Promise.resolve();
    state.loading = true;

    var btn = $('#refreshBtn');
    if(btn) btn.classList.add('spinning');
    if(!state.items.length) setSubtitle('正在读取资料…');

    var url = CSV_URL + '&_=' + Date.now();

    return fetch(url, { cache: 'no-store', redirect: 'follow' })
      .then(function(res){
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function(text){
        if(/^\s*<(!doctype|html)/i.test(text)) throw new Error('返回内容不是 CSV');
        var rows = parseCSV(text);
        var items = buildItems(rows);
        if(!items.length) throw new Error('CSV 中没有可用资料');

        state.items = items;
        state.error = '';
        saveCache(items);
      })
      .catch(function(err){
        if(window.console) console.error('[咖啡馆收藏集]', err);

        if(!state.items.length){
          var cached = loadCache();
          if(cached && cached.length){
            state.items = cached;
            state.error = '';
            toast('离线模式：显示上次的资料');
          } else {
            state.error = '资料读取失败，请检查网络后重试。';
          }
        } else {
          toast('更新失败，仍显示现有资料');
        }
      })
      .then(function(){
        state.loading = false;
        if(btn) btn.classList.remove('spinning');
        render();
      });
  }

  /* ========================================================
     事件绑定
     ======================================================== */
  function bindEvents(){
    var content = $('#content');
    if(!content) return;

    content.addEventListener('click', function(e){
      // 重试按钮
      if(e.target.closest('#retryBtn')){
        loadData(true);
        return;
      }

      // 展开 / 收起
      var exp = e.target.closest('.expand-btn');
      if(exp){
        var cat = exp.getAttribute('data-cat');
        if(state.expanded.has(cat)) state.expanded.delete(cat);
        else state.expanded.add(cat);
        render();
        return;
      }

      // 卡片内按钮 / 链接
      var actEl = e.target.closest('[data-act]');
      if(actEl){
        var act = actEl.getAttribute('data-act');
        if(act === 'xhs'){
          // 让链接正常跳转
          return;
        }
        e.preventDefault();
        e.stopPropagation();

        var card = actEl.closest('.card');
        if(!card) return;
        var id = card.getAttribute('data-id');

        if(act === 'nav') navigateTo(id);
        else if(act === 'visited') toggleVisited(id);
        return;
      }

      // 点击卡片主体 → 导航
      var cardEl = e.target.closest('.card');
      if(cardEl){
        navigateTo(cardEl.getAttribute('data-id'));
      }
    });

    // 键盘：Enter / Space 打开导航
    content.addEventListener('keydown', function(e){
      if(e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
      var card = e.target.closest('.card');
      if(card && e.target === card){
        e.preventDefault();
        navigateTo(card.getAttribute('data-id'));
      }
    });

    // 搜索（防抖）
    var search = $('#search');
    var timer = null;
    if(search){
      search.addEventListener('input', function(){
        var v = search.value;
        clearTimeout(timer);
        timer = setTimeout(function(){
          state.query = v;
          render();
        }, 130);
      });
    }

    // 筛选
    $$('.chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        state.filter = chip.getAttribute('data-filter') || 'all';
        $$('.chip').forEach(function(c){
          c.classList.toggle('active', c === chip);
        });
        render();
      });
    });

    // 刷新按钮
    var rb = $('#refreshBtn');
    if(rb){
      rb.addEventListener('click', function(){
        loadData(true);
      });
    }
  }

  /* ========================================================
     下拉刷新
     ======================================================== */
  function initPullToRefresh(){
    var ind = $('#pullIndicator');
    var txt = $('#pullText');
    if(!ind || !txt) return;

    var startX = 0, startY = 0, dist = 0;
    var active = false, refreshing = false;

    function scrollerTop(){
      var se = document.scrollingElement || document.documentElement;
      return (window.scrollY || window.pageYOffset || (se ? se.scrollTop : 0) || 0);
    }

    function paint(d){
      ind.style.transform = 'translate(-50%, calc(-100% + ' + d + 'px))';
      ind.style.opacity = d > 0 ? '1' : '0';
      txt.textContent = d >= PULL_THRESHOLD ? '松开即可刷新' : '下拉刷新';
    }

    function reset(){
      active = false;
      dist = 0;
      ind.style.transition = 'transform .28s cubic-bezier(.2,.8,.3,1), opacity .28s ease';
      ind.style.transform = 'translate(-50%, -100%)';
      ind.style.opacity = '0';
      txt.textContent = '下拉刷新';
      setTimeout(function(){ ind.style.transition = ''; }, 300);
    }

    function startRefresh(){
      if(refreshing) return;
      refreshing = true;

      ind.style.transition = 'transform .2s ease';
      ind.style.transform = 'translate(-50%, 14px)';
      ind.style.opacity = '1';
      ind.classList.add('spinning');
      txt.textContent = '正在刷新…';

      Promise.resolve(loadData(true)).then(function(){
        setTimeout(function(){
          ind.classList.remove('spinning');
          reset();
          refreshing = false;
        }, 320);
      }).catch(function(){
        setTimeout(function(){
          ind.classList.remove('spinning');
          reset();
          refreshing = false;
        }, 320);
      });
    }

    window.addEventListener('touchstart', function(e){
      if(refreshing) return;
      if(e.touches.length > 1) return;
      if(scrollerTop() > 0) return;

      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      dist = 0;
      active = true;
    }, { passive: true });

    window.addEventListener('touchmove', function(e){
      if(!active || refreshing) return;

      var t = e.touches[0];
      var dy = t.clientY - startY;
      var dx = Math.abs(t.clientX - startX);

      if(scrollerTop() > 0 || dy <= 0){
        if(dist > 0) reset();
        active = false;
        return;
      }

      // 横向滑动优先交给卡片轨道
      if(dx > dy) return;

      dist = Math.min(dy * 0.5, 100);
      paint(dist);

      if(e.cancelable) e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', function(){
      if(!active) return;
      if(dist >= PULL_THRESHOLD){
        startRefresh();
      } else {
        reset();
      }
      active = false
