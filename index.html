<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FEONG咖啡馆">
<meta name="theme-color" content="#F5F0EB">
<title>FEONG的咖啡馆收藏集</title>
<style>
/* ===== CSS Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #F5F0EB;
  --surface: #FFFFFF;
  --surface-alt: #FAF7F4;
  --text-primary: #2C2420;
  --text-secondary: #8C7E72;
  --text-tertiary: #B5A89C;
  --accent: #C4A882;
  --accent-dark: #A88B62;
  --accent-light: #E8DCCF;
  --success: #7BA87E;
  --success-light: #E8F0E8;
  --favorite: #D4836A;
  --favorite-light: #F8E8E3;
  --radius-sm: 10px;
  --radius: 16px;
  --radius-lg: 20px;
  --shadow-sm: 0 1px 3px rgba(44,36,32,0.06);
  --shadow: 0 2px 12px rgba(44,36,32,0.08);
  --shadow-lg: 0 4px 24px rgba(44,36,32,0.12);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

/* ===== Pull-to-Refresh ===== */
#ptr-indicator {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  height: 60px; margin-top: -60px;
  font-size: 13px; color: var(--text-secondary);
  z-index: 100; pointer-events: none;
  transition: margin-top 0.2s ease;
}
#ptr-indicator.active { margin-top: 0; }
#ptr-indicator .spinner {
  width: 20px; height: 20px; margin-right: 8px;
  border: 2px solid var(--accent-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== App Header ===== */
.app-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(245,240,235,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: calc(12px + var(--safe-top)) 16px 10px;
  border-bottom: 1px solid rgba(196,168,130,0.15);
}
.app-header h1 {
  font-size: 1.25rem; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.app-header h1 .emoji { font-size: 1.3rem; }
.app-header h1 .count {
  font-size: 0.7rem; font-weight: 500;
  color: var(--text-tertiary);
  background: var(--accent-light);
  padding: 2px 8px; border-radius: 20px;
  margin-left: auto;
}

/* ===== Search Bar ===== */
.search-wrap {
  position: relative; margin-bottom: 10px;
}
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 36px;
  border: 1.5px solid rgba(196,168,130,0.25);
  border-radius: var(--radius-sm);
  background: var(--surface);
  font-size: 0.9rem; font-family: inherit;
  color: var(--text-primary);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(196,168,130,0.12);
}
.search-wrap input::placeholder { color: var(--text-tertiary); }
.search-wrap .search-icon {
  position: absolute; left: 12px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary); font-size: 0.9rem;
  pointer-events: none;
}

/* ===== Filter Chips ===== */
.filter-bar {
  display: flex; gap: 8px;
  overflow-x: auto; padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 5px;
  padding: 7px 14px;
  border: 1.5px solid rgba(196,168,130,0.3);
  border-radius: 50px;
  background: var(--surface);
  font-size: 0.82rem; font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer; user-select: none;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.filter-chip:active { transform: scale(0.96); }
.filter-chip.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff;
}
.filter-chip .chip-badge {
  font-size: 0.65rem; font-weight: 600;
  background: var(--accent-light); color: var(--accent-dark);
  padding: 1px 6px; border-radius: 10px;
  min-width: 18px; text-align: center;
}
.filter-chip.active .chip-badge {
  background: rgba(255,255,255,0.3); color: #fff;
}

/* ===== Category Nav (horizontal scroll) ===== */
.cat-nav {
  display: flex; gap: 6px;
  overflow-x: auto; padding: 4px 16px 8px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-snap-type: x proximity;
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-nav-item {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 50px;
  background: var(--surface);
  border: 1px solid rgba(196,168,130,0.15);
  font-size: 0.75rem; font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer; user-select: none;
  transition: all 0.15s ease;
  white-space: nowrap;
  scroll-snap-align: start;
}
.cat-nav-item:active { background: var(--accent-light); }
.cat-nav-item.active {
  background: var(--accent-dark); border-color: var(--accent-dark); color: #fff;
}

/* ===== Main Content ===== */
.main-content {
  padding: 4px 0 calc(24px + var(--safe-bottom));
}

/* ===== Section ===== */
.section { margin-bottom: 8px; }
.section-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px 6px;
}
.section-header h2 {
  font-size: 0.95rem; font-weight: 700;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 6px;
}
.section-header .section-count {
  font-size: 0.7rem; font-weight: 500;
  color: var(--text-tertiary);
  background: var(--accent-light);
  padding: 1px 7px; border-radius: 20px;
}
.section-header .expand-btn {
  margin-left: auto;
  font-size: 0.75rem; font-weight: 600;
  color: var(--accent-dark);
  background: none; border: none;
  cursor: pointer; padding: 4px 8px;
  border-radius: 8px;
  font-family: inherit;
  transition: background 0.15s;
}
.section-header .expand-btn:active { background: var(--accent-light); }

/* ===== Card Rail (horizontal scroll-snap) ===== */
.card-rail {
  display: flex; gap: 12px;
  overflow-x: auto;
  padding: 4px 16px 12px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  scroll-snap-type: x mandatory;
}
.card-rail::-webkit-scrollbar { display: none; }
.card-rail .cafe-card {
  flex-shrink: 0;
  width: 240px;
  scroll-snap-align: start;
}
/* Grid mode for expanded */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 4px 16px 12px;
}
.card-grid .cafe-card { width: auto; }

/* ===== Cafe Card ===== */
.cafe-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  border: 1px solid rgba(196,168,130,0.1);
  transition: box-shadow 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.cafe-card:active { transform: scale(0.98); box-shadow: var(--shadow); }
.cafe-card .card-cat-stripe {
  position: absolute; top: 0; left: 0; right: 0;
  height: 3px;
}
.cafe-card .card-name {
  font-size: 0.9rem; font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 4px;
  line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cafe-card .card-location {
  font-size: 0.75rem; color: var(--text-secondary);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 3px;
  line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 1;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cafe-card .card-location .loc-icon { font-size: 0.7rem; }
.cafe-card .card-desc {
  font-size: 0.72rem; color: var(--text-tertiary);
  line-height: 1.4; margin-bottom: 10px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.cafe-card .card-cat-tag {
  display: inline-block;
  font-size: 0.65rem; font-weight: 600;
  padding: 2px 8px; border-radius: 20px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* ===== Card Action Buttons ===== */
.card-actions {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.action-btn {
  flex: 1;
  min-width: 0;
  display: flex; align-items: center; justify-content: center;
  gap: 3px;
  padding: 6px 4px;
  border: 1px solid rgba(196,168,130,0.2);
  border-radius: 8px;
  background: var(--surface-alt);
  font-size: 0.68rem; font-weight: 500;
  font-family: inherit;
  color: var(--text-secondary);
  cursor: pointer; user-select: none;
  transition: all 0.15s ease;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.action-btn:active { transform: scale(0.95); }
.action-btn .btn-icon { font-size: 0.8rem; }
.action-btn.xhs-btn { color: #E85D4A; border-color: rgba(232,93,74,0.2); background: rgba(232,93,74,0.06); }
.action-btn.nav-btn { color: #4A90D9; border-color: rgba(74,144,217,0.2); background: rgba(74,144,217,0.06); }
.action-btn.fav-btn.active { color: var(--favorite); border-color: var(--favorite); background: var(--favorite-light); }
.action-btn.visit-btn.active { color: var(--success); border-color: var(--success); background: var(--success-light); }
.action-btn.disabled { opacity: 0.35; pointer-events: none; }

/* ===== Empty State ===== */
.empty-state {
  text-align: center; padding: 40px 24px;
  color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 8px; }
.empty-state p { font-size: 0.85rem; }

/* ===== Loading ===== */
.loading-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 60px 24px; gap: 12px;
}
.loading-state .spinner-lg {
  width: 32px; height: 32px;
  border: 3px solid var(--accent-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-state p { font-size: 0.85rem; color: var(--text-tertiary); }

/* ===== Toast ===== */
#toast {
  position: fixed; bottom: calc(24px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--text-primary); color: #fff;
  padding: 10px 20px; border-radius: 50px;
  font-size: 0.8rem; font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0; transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 200; pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Tab view (favorites/visited) ===== */
.tab-view-header {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px 8px;
}
.tab-view-header h2 {
  font-size: 1rem; font-weight: 700;
}
.back-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 6px 12px;
  border: 1px solid rgba(196,168,130,0.25);
  border-radius: 50px;
  background: var(--surface);
  font-size: 0.8rem; font-weight: 500;
  font-family: inherit;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.back-btn:active { background: var(--accent-light); }

/* ===== Responsive ===== */
@media (min-width: 768px) {
  .app-header { padding-left: 24px; padding-right: 24px; }
  .app-header h1 { font-size: 1.4rem; }
  .cat-nav { padding-left: 24px; padding-right: 24px; }
  .card-rail { padding-left: 24px; padding-right: 24px; }
  .card-grid { padding-left: 24px; padding-right: 24px; }
  .section-header { padding-left: 24px; padding-right: 24px; }
  .card-rail .cafe-card { width: 260px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
}
@media (min-width: 1024px) {
  .app-header { padding-left: 32px; padding-right: 32px; max-width: 960px; margin: 0 auto; }
  .cat-nav, .card-rail, .card-grid, .section-header { max-width: 960px; margin-left: auto; margin-right: auto; }
  .cat-nav { padding-left: 32px; padding-right: 32px; }
  .card-rail { padding-left: 32px; padding-right: 32px; }
  .card-grid { padding-left: 32px; padding-right: 32px; }
  .section-header { padding-left: 32px; padding-right: 32px; }
  .card-rail .cafe-card { width: 280px; }
}

/* ===== Scroll snap for category nav ===== */
.cat-nav { scroll-padding-left: 16px; }

/* ===== Skeleton loading ===== */
.skeleton {
  background: linear-gradient(90deg, var(--surface-alt) 25%, #f0ebe5 50%, var(--surface-alt) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
</style>
</head>
<body>

<!-- Pull to refresh indicator -->
<div id="ptr-indicator">
  <div class="spinner"></div>
  <span>下拉刷新...</span>
</div>

<!-- App Header -->
<header class="app-header">
  <h1>
    <span class="emoji">☕</span>
    FEONG的咖啡馆收藏集
    <span class="count" id="totalCount">--</span>
  </h1>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" placeholder="搜索咖啡馆、地区、分类..." autocomplete="off" enterkeyhint="search">
  </div>
  <div class="filter-bar" id="filterBar">
    <button class="filter-chip" data-filter="all" id="chipAll">
      <span>全部</span>
      <span class="chip-badge" id="badgeAll">0</span>
    </button>
    <button class="filter-chip" data-filter="favorites" id="chipFav">
      <span>❤️ 收藏</span>
      <span class="chip-badge" id="badgeFav">0</span>
    </button>
    <button class="filter-chip" data-filter="visited" id="chipVisited">
      <span>✅ 已去过</span>
      <span class="chip-badge" id="badgeVisited">0</span>
    </button>
  </div>
</header>

<!-- Category Nav -->
<nav class="cat-nav" id="catNav"></nav>

<!-- Main Content -->
<main class="main-content" id="mainContent">
  <div class="loading-state" id="loadingState">
    <div class="spinner-lg"></div>
    <p>正在加载咖啡馆数据...</p>
  </div>
</main>

<!-- Toast -->
<div id="toast"></div>

<script>
(function() {
'use strict';

// ===== Config =====
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
const STORAGE_FAV = 'feong_cafe_favorites';
const STORAGE_VISITED = 'feong_cafe_visited';
const CACHE_KEY = 'feong_cafe_data';
const CACHE_TIME = 'feong_cafe_time';

// Category color map
const CAT_COLORS = {
  'cafe':      { bg: '#F0E6D3', text: '#8B6914', stripe: '#C4A882' },
  'dessert':   { bg: '#FCE4EC', text: '#AD1457', stripe: '#F48FB1' },
  'bar':       { bg: '#EDE7F6', text: '#4527A0', stripe: '#B39DDB' },
  'western':   { bg: '#E3F2FD', text: '#1565C0', stripe: '#90CAF9' },
  'thai':      { bg: '#E8F5E9', text: '#2E7D32', stripe: '#A5D6A7' },
  'korean':    { bg: '#FFF3E0', text: '#E65100', stripe: '#FFCC80' },
  'japanese':  { bg: '#FCE4EC', text: '#C62828', stripe: '#EF9A9A' },
  'kopitiam':  { bg: '#EFEBE9', text: '#4E342E', stripe: '#BCAAA4' },
  'nyonya':    { bg: '#E0F2F1', text: '#00695C', stripe: '#80CBC4' },
  'chinese':   { bg: '#FFF8E1', text: '#F57F17', stripe: '#FFE082' },
  'asian':     { bg: '#F3E5F5', text: '#6A1B9A', stripe: '#CE93D8' },
  'fine dine': { bg: '#ECEFF1', text: '#37474F', stripe: '#90A4AE' },
  'hatyai':    { bg: '#E8EAF6', text: '#283593', stripe: '#9FA8DA' }
};
const DEFAULT_COLOR = { bg: '#F0EBE5', text: '#6D5D4B', stripe: '#C4A882' };

function getCatColor(cat) {
  const key = (cat || '').toLowerCase().trim();
  return CAT_COLORS[key] || DEFAULT_COLOR;
}

// ===== State =====
let allCafes = [];
let favorites = new Set();
let visited = new Set();
let currentFilter = 'all'; // all | favorites | visited
let currentCategory = 'all';
let searchQuery = '';
let expandedSections = new Set();
let dataLoaded = false;

// ===== Utility =====
function $(id) { return document.getElementById(id); }
function toast(msg, duration) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), duration || 1800);
}

function loadSet(key) {
  try { return new Set(JSON.parse(localStorage.getItem(key) || '[]')); }
  catch(e) { return new Set(); }
}
function saveSet(key, set) {
  try { localStorage.setItem(key, JSON.stringify([...set])); } catch(e) {}
}

// ===== CSV Parser (handles quoted fields) =====
function parseCSV(text) {
  const rows = [];
  let current = '';
  let inQuotes = false;
  let fields = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (i + 1 < text.length && text[i+1] === '"') { current += '"'; i++; }
        else { inQuotes = false; }
      } else { current += ch; }
    } else {
      if (ch === '"') { inQuotes = true; }
      else if (ch === ',') { fields.push(current.trim()); current = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && i + 1 < text.length && text[i+1] === '\n') i++;
        fields.push(current.trim());
        if (fields.some(f => f !== '')) rows.push([...fields]);
        fields = []; current = '';
      } else { current += ch; }
    }
  }
  fields.push(current.trim());
  if (fields.some(f => f !== '')) rows.push([...fields]);
  return rows;
}

// ===== Data Loading =====
async function fetchData(forceRefresh) {
  // Try cache first (unless force refresh)
  if (!forceRefresh) {
    try {
      const cached = localStorage.getItem(CACHE_KEY);
      const cachedTime = localStorage.getItem(CACHE_TIME);
      if (cached && cachedTime && (Date.now() - parseInt(cachedTime)) < 5 * 60 * 1000) {
        const parsed = JSON.parse(cached);
        if (parsed && parsed.length > 0) {
          allCafes = parsed;
          dataLoaded = true;
          renderAll();
          return;
        }
      }
    } catch(e) {}
  }

  // Try multiple fetch strategies
  const urls = [
    CSV_URL,
    'https://corsproxy.io/?' + encodeURIComponent(CSV_URL),
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(CSV_URL)
  ];

  let lastError = null;
  for (const url of urls) {
    try {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error('No data rows');

      // Parse header
      const header = rows[0].map(h => h.toLowerCase().trim());
      const nameIdx = header.findIndex(h => h.includes('name') || h.includes('名字') || h.includes('名称'));
      const locIdx = header.findIndex(h => h.includes('location') || h.includes('地区') || h.includes('地点') || h.includes('地址'));
      const catIdx = header.findIndex(h => h.includes('category') || h.includes('分类') || h.includes('类别'));
      const descIdx = header.findIndex(h => h.includes('desc') || h.includes('描述') || h.includes('简介'));
      const xhsIdx = header.findIndex(h => h.includes('xhs') || h.includes('小红书') || h.includes('link') || h.includes('链接'));

      allCafes = rows.slice(1).map((r, i) => ({
        id: 'cafe_' + i,
        name: (r[nameIdx >= 0 ? nameIdx : 0] || '').trim(),
        location: (r[locIdx >= 0 ? locIdx : 1] || '').trim(),
        category: (r[catIdx >= 0 ? catIdx : 2] || '').trim(),
        description: (r[descIdx >= 0 ? descIdx : 3] || '').trim(),
        xhs: (r[xhsIdx >= 0 ? xhsIdx : 4] || '').trim()
      })).filter(c => c.name);

      if (allCafes.length === 0) throw new Error('Empty after parse');

      // Cache
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify(allCafes));
        localStorage.setItem(CACHE_TIME, Date.now().toString());
      } catch(e) {}

      dataLoaded = true;
      renderAll();
      return;
    } catch(e) {
      lastError = e;
      console.warn('Fetch attempt failed:', url, e.message);
    }
  }

  // All failed — try cache even if stale
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
      const parsed = JSON.parse(cached);
      if (parsed && parsed.length > 0) {
        allCafes = parsed;
        dataLoaded = true;
        renderAll();
        toast('使用离线缓存数据', 2000);
        return;
      }
    }
  } catch(e) {}

  // Nothing works
  $('mainContent').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">📡</div>
      <p>数据加载失败，请检查网络连接</p>
      <p style="font-size:0.75rem;margin-top:8px;color:var(--text-tertiary)">${lastError ? lastError.message : '未知错误'}</p>
    </div>`;
}

// ===== Rendering =====
function getFilteredCafes() {
  let list = allCafes;

  // Filter by favorites/visited
  if (currentFilter === 'favorites') {
    list = list.filter(c => favorites.has(c.id));
  } else if (currentFilter === 'visited') {
    list = list.filter(c => visited.has(c.id));
  }

  // Filter by category
  if (currentCategory !== 'all') {
    list = list.filter(c => c.category.toLowerCase().trim() === currentCategory);
  }

  // Search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(c =>
      c.name.toLowerCase().includes(q) ||
      c.location.toLowerCase().includes(q) ||
      c.category.toLowerCase().includes(q) ||
      c.description.toLowerCase().includes(q)
    );
  }

  return list;
}

function getCategories() {
  const cats = new Set();
  allCafes.forEach(c => { if (c.category) cats.add(c.category.toLowerCase().trim()); });
  return [...cats].sort();
}

function renderAll() {
  renderFilterBadges();
  renderCategoryNav();
  renderMain();
  updateTotalCount();
}

function updateTotalCount() {
  const filtered = getFilteredCafes();
  $('totalCount').textContent = filtered.length + ' 间';
}

function renderFilterBadges() {
  $('badgeAll').textContent = allCafes.length;
  $('badgeFav').textContent = favorites.size;
  $('badgeVisited').textContent = visited.size;
}

function renderCategoryNav() {
  const cats = getCategories();
  const nav = $('catNav');
  let html = `<button class="cat-nav-item${currentCategory === 'all' ? ' active' : ''}" data-cat="all">全部</button>`;
  cats.forEach(cat => {
    html += `<button class="cat-nav-item${currentCategory === cat ? ' active' : ''}" data-cat="${escapeAttr(cat)}">${escapeHtml(cat)}</button>`;
  });
  nav.innerHTML = html;

  nav.querySelectorAll('.cat-nav-item').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCategory = btn.dataset.cat;
      expandedSections.delete('cat_' + currentCategory);
      renderAll();
      // Scroll active into view
      btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
    });
  });
}

function renderMain() {
  const main = $('mainContent');
  const filtered = getFilteredCafes();

  if (filtered.length === 0) {
    if (!dataLoaded) return;
    main.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${currentFilter === 'favorites' ? '💔' : currentFilter === 'visited' ? '📍' : '🔍'}</div>
        <p>${currentFilter === 'favorites' ? '还没有收藏的咖啡馆' : currentFilter === 'visited' ? '还没有标记已去过的咖啡馆' : '没有找到匹配的咖啡馆'}</p>
      </div>`;
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(c => {
    const cat = c.category.toLowerCase().trim() || '其它';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(c);
  });

  // Sort groups alphabetically
  const sortedCats = Object.keys(groups).sort();

  let html = '';
  sortedCats.forEach(cat => {
    const cafes = groups[cat];
    const color = getCatColor(cat);
    const sectionKey = 'cat_' + cat;
    const isExpanded = expandedSections.has(sectionKey);
    const showExpand = cafes.length > 3;

    html += `<section class="section" data-section="${escapeAttr(sectionKey)}">`;
    html += `<div class="section-header">`;
    html += `<h2><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color.stripe};"></span> ${escapeHtml(cat)}</h2>`;
    html += `<span class="section-count">${cafes.length}</span>`;
    if (showExpand) {
      html += `<button class="expand-btn" data-expand="${escapeAttr(sectionKey)}">${isExpanded ? '收起' : '查看全部 ›'}</button>`;
    }
    html += `</div>`;

    if (isExpanded || cafes.length <= 3) {
      html += `<div class="card-grid">`;
    } else {
      html += `<div class="card-rail">`;
    }

    const displayCafes = (isExpanded || cafes.length <= 3) ? cafes : cafes.slice(0, 3);
    displayCafes.forEach(c => {
      html += renderCard(c);
    });

    html += `</div></section>`;
  });

  main.innerHTML = html;

  // Bind expand buttons
  main.querySelectorAll('.expand-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.dataset.expand;
      if (expandedSections.has(key)) expandedSections.delete(key);
      else expandedSections.add(key);
      renderMain();
    });
  });

  // Bind card actions (event delegation)
  main.addEventListener('click', handleCardClick);
}

function renderCard(cafe) {
  const color = getCatColor(cafe.category);
  const isFav = favorites.has(cafe.id);
  const isVisited = visited.has(cafe.id);
  const hasXhs = cafe.xhs && cafe.xhs.startsWith('http');
  const hasLoc = cafe.location && cafe.location.length > 0;

  return `
    <div class="cafe-card" data-id="${escapeAttr(cafe.id)}">
      <div class="card-cat-stripe" style="background:${color.stripe};"></div>
      <div class="card-cat-tag" style="background:${color.bg};color:${color.text};">${escapeHtml(cafe.category || '其它')}</div>
      <div class="card-name">${escapeHtml(cafe.name)}</div>
      ${hasLoc ? `<div class="card-location"><span class="loc-icon">📍</span>${escapeHtml(cafe.location)}</div>` : ''}
      ${cafe.description ? `<div class="card-desc">${escapeHtml(cafe.description)}</div>` : ''}
      <div class="card-actions">
        ${hasXhs ? `<button class="action-btn xhs-btn" data-action="xhs" data-id="${escapeAttr(cafe.id)}" title="小红书"><span class="btn-icon">📕</span>小红书</button>` : ''}
        ${hasLoc ? `<button class="action-btn nav-btn" data-action="nav" data-id="${escapeAttr(cafe.id)}" title="导航"><span class="btn-icon">🧭</span>导航</button>` : ''}
        <button class="action-btn fav-btn${isFav ? ' active' : ''}" data-action="fav" data-id="${escapeAttr(cafe.id)}" title="收藏">
          <span class="btn-icon">${isFav ? '❤️' : '🤍'}</span>${isFav ? '已藏' : '收藏'}
        </button>
        <button class="action-btn visit-btn${isVisited ? ' active' : ''}" data-action="visit" data-id="${escapeAttr(cafe.id)}" title="已去过">
          <span class="btn-icon">${isVisited ? '✅' : '⬜'}</span>${isVisited ? '去过' : '去过'}
        </button>
      </div>
    </div>`;
}

// ===== Card Action Handler =====
function handleCardClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  e.preventDefault();
  e.stopPropagation();

  const action = btn.dataset.action;
  const id = btn.dataset.id;
  const cafe = allCafes.find(c => c.id === id);
  if (!cafe) return;

  if (action === 'xhs') {
    if (cafe.xhs && cafe.xhs.startsWith('http')) {
      window.open(cafe.xhs, '_blank', 'noopener');
    } else {
      toast('暂无小红书链接');
    }
  } else if (action === 'nav') {
    if (cafe.location) {
      const query = encodeURIComponent(cafe.location);
      const ua = navigator.userAgent || '';
      const isIOS = /iPad|iPhone|iPod/.test(ua);
      if (isIOS) {
        window.open('maps://maps.apple.com/?q=' + query, '_blank');
      } else {
        window.open('https://www.google.com/maps/search/?api=1&query=' + query, '_blank');
      }
    } else {
      toast('暂无位置信息');
    }
  } else if (action === 'fav') {
    if (favorites.has(id)) {
      favorites.delete(id);
      toast('已取消收藏');
    } else {
      favorites.add(id);
      toast('已收藏 ❤️');
    }
    saveSet(STORAGE_FAV, favorites);
    renderFilterBadges();
    // Update button in place
    const card = btn.closest('.cafe-card');
    if (card) {
      const favBtn = card.querySelector('[data-action="fav"]');
      if (favBtn) {
        const isFav = favorites.has(id);
        favBtn.classList.toggle('active', isFav);
        favBtn.innerHTML = `<span class="btn-icon">${isFav ? '❤️' : '🤍'}</span>${isFav ? '已藏' : '收藏'}`;
      }
    }
    if (currentFilter === 'favorites') renderMain();
  } else if (action === 'visit') {
    if (visited.has(id)) {
      visited.delete(id);
      toast('已取消去过标记');
    } else {
      visited.add(id);
      toast('已标记去过 ✅');
    }
    saveSet(STORAGE_VISITED, visited);
    renderFilterBadges();
    const card = btn.closest('.cafe-card');
    if (card) {
      const visitBtn = card.querySelector('[data-action="visit"]');
      if (visitBtn) {
        const isVisited = visited.has(id);
        visitBtn.classList.toggle('active', isVisited);
        visitBtn.innerHTML = `<span class="btn-icon">${isVisited ? '✅' : '⬜'}</span>${isVisited ? '去过' : '去过'}`;
      }
    }
    if (currentFilter === 'visited') renderMain();
  }
}

// ===== Escape helpers =====
function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== Search =====
let searchTimer;
$('searchInput').addEventListener('input', function() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = this.value.trim();
    renderMain();
    updateTotalCount();
  }, 200);
});

// ===== Filter Chips =====
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    currentFilter = chip.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    expandedSections.clear();
    renderMain();
    updateTotalCount();
  });
});

// ===== Pull to Refresh =====
(function initPullToRefresh() {
  let startY = 0;
  let pulling = false;
  let tracking = false;
  const indicator = $('ptr-indicator');
  const threshold = 80;

  document.addEventListener('touchstart', function(e) {
    if (window.scrollY <= 2 && e.touches.length === 1) {
      startY = e.touches[0].clientY;
      tracking = true;
      pulling = false;
    }
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!tracking) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && window.scrollY <= 2) {
      pulling = true;
      const pull = Math.min(dy * 0.5, 120);
      indicator.style.marginTop = (-60 + pull) + 'px';
      if (pull > threshold) {
        indicator.classList.add('active');
        indicator.querySelector('span').textContent = '释放刷新...';
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', function() {
    if (pulling) {
      const mt = parseFloat(indicator.style.marginTop) || -60;
      if (mt > -60 + threshold) {
        indicator.querySelector('span').textContent = '正在刷新...';
        indicator.classList.add('active');
        fetchData(true).finally(() => {
          setTimeout(() => {
            indicator.classList.remove('active');
            indicator.style.marginTop = '-60px';
            indicator.querySelector('span').textContent = '下拉刷新...';
          }, 600);
        });
      } else {
        indicator.classList.remove('active');
        indicator.style.marginTop = '-60px';
      }
    }
    tracking = false;
    pulling = false;
  });
})();

// ===== Service Worker (for PWA offline + standalone pull-to-refresh) =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    const swCode = `
      const CACHE = 'feong-cafe-v1';
      self.addEventListener('install', e => { self.skipWaiting(); });
      self.addEventListener('activate', e => { e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', e => {
        if (e.request.url.includes('docs.google.com') || e.request.url.includes('corsproxy') || e.request.url.includes('allorigins')) {
          e.respondWith(
            fetch(e.request).then(r => {
              const clone = r.clone();
              caches.open(CACHE).then(c => c.put(e.request, clone));
              return r;
            }).catch(() => caches.match(e.request))
          );
        }
      });
    `;
    const blob = new Blob([swCode], { type: 'application/javascript' });
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
  });
}

// ===== Init =====
favorites = loadSet(STORAGE_FAV);
visited = loadSet(STORAGE_VISITED);

// Set default active chip
$('chipAll').classList.add('active');

// Fetch data
fetchData(false);

// Re-check cache age periodically
setInterval(() => {
  try {
    const cachedTime = localStorage.getItem(CACHE_TIME);
    if (cachedTime && (Date.now() - parseInt(cachedTime)) > 30 * 60 * 1000) {
      fetchData(true);
    }
  } catch(e) {}
}, 10 * 60 * 1000);

})();
</script>
