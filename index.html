<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f5f0e8">
  <title>FEONG的咖啡馆收藏集</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --surface: #ffffff;
      --surface-2: #faf7f2;
      --text: #2c2416;
      --text-secondary: #6b5f4f;
      --text-muted: #9b8f7f;
      --accent: #b8860b;
      --accent-soft: #f5e6c8;
      --accent-hover: #9a7209;
      --border: #e8e0d4;
      --shadow-sm: 0 1px 3px rgba(44,36,22,0.06);
      --shadow-md: 0 4px 12px rgba(44,36,22,0.08);
      --shadow-lg: 0 8px 24px rgba(44,36,22,0.12);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: contain;
    }

    /* ========== 下拉刷新 ========== */
    .pull-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-100%);
      transition: opacity 0.2s, transform 0.2s;
    }

    .pull-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .pull-indicator .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .pull-indicator .text {
      margin-left: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ========== 应用容器 ========== */
    .app {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      scroll-behavior: smooth;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    /* ========== 头部 ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 240, 232, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 16px 8px;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .header-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }

    .header-title span {
      color: var(--accent);
    }

    .header-meta {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-align: right;
      line-height: 1.3;
    }

    .header-meta .count {
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }

    /* ========== 搜索栏 ========== */
    .search-bar {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-bar .search-icon {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-bar input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 42px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      font-size: 15px;
      font-family: var(--font);
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    .search-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.12);
    }

    .search-bar .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border: none;
      background: var(--border);
      border-radius: 50%;
      color: var(--text-secondary);
      font-size: 14px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      -webkit-appearance: none;
      appearance: none;
    }

    .search-bar .clear-btn.visible {
      display: flex;
    }

    /* ========== 主内容 ========== */
    .main {
      padding: 12px 16px 32px;
    }

    /* ========== 分组 ========== */
    .group {
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .group-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .group-title .icon {
      font-size: 18px;
    }

    .group-title .badge {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 1px 8px;
      border-radius: 10px;
    }

    .group-toggle {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      font-family: var(--font);
      transition: background 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }

    .group-toggle:active {
      background: var(--accent-soft);
    }

    /* 横向滚动容器 */
    .scroll-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      touch-action: pan-x pan-y;
    }

    .scroll-row::-webkit-scrollbar {
      display: none;
    }

    /* 展开模式 */
    .scroll-row.expanded {
      flex-wrap: wrap;
      overflow-x: visible;
      scroll-snap-type: none;
    }

    .scroll-row.expanded .card {
      flex: 0 0 calc(50% - 6px);
      min-width: 0;
      scroll-snap-align: none;
    }

    /* ========== 卡片 ========== */
    .card {
      flex: 0 0 200px;
      min-width: 200px;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      position: relative;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-x pan-y;
    }

    .card:active {
      transform: scale(0.97);
      box-shadow: var(--shadow-md);
    }

    /* 卡片顶部色条 */
    .card-stripe {
      height: 4px;
      background: var(--accent);
      opacity: 0.7;
    }

    .card-body {
      padding: 12px 14px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .card-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      background: var(--surface-2);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .card-tag.category {
      background: var(--accent-soft);
      color: var(--accent-hover);
      border-color: transparent;
    }

    .card-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .card-action-btn {
      flex: 1;
      height: 30px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: all 0.15s;
      -webkit-appearance: none;
      appearance: none;
      white-space: nowrap;
    }

    .card-action-btn:active {
      transform: scale(0.95);
    }

    .card-action-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .card-action-btn.map-btn {
      background: var(--surface-2);
      border-color: var(--border);
      color: var(--text-secondary);
      text-decoration: none;
    }

    .card-action-btn.map-btn:active {
      background: var(--accent-soft);
    }

    /* ========== 空状态 ========== */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-state .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .empty-state .sub {
      font-size: 13px;
    }

    /* ========== 加载骨架 ========== */
    .skeleton-row {
      display: flex;
      gap: 12px;
      padding-bottom: 8px;
    }

    .skeleton-card {
      flex: 0 0 200px;
      min-width: 200px;
      height: 160px;
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ========== 搜索无结果 ========== */
    .no-results {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    /* ========== 响应式 ========== */
    @media (min-width: 600px) {
      .main {
        padding: 16px 24px 40px;
        max-width: 900px;
        margin: 0 auto;
      }

      .header {
        padding: 14px 24px 10px;
      }

      .header-title {
        font-size: 22px;
      }

      .card {
        flex: 0 0 220px;
        min-width: 220px;
      }

      .scroll-row.expanded .card {
        flex: 0 0 calc(33.33% - 8px);
      }
    }

    @media (min-width: 1024px) {
      .main {
        max-width: 1100px;
      }

      .card {
        flex: 0 0 240px;
        min-width: 240px;
      }

      .scroll-row.expanded .card {
        flex: 0 0 calc(25% - 9px);
      }
    }

    /* ========== 安全区域 ========== */
    @supports (padding: env(safe-area-inset-bottom)) {
      .main {
        padding-bottom: calc(32px + env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- 下拉刷新指示器 -->
  <div class="pull-indicator" id="pullIndicator">
    <div class="spinner"></div>
    <span class="text" id="pullText">下拉刷新</span>
  </div>

  <!-- 应用主体 -->
  <div class="app" id="app">

    <!-- 头部 -->
    <header class="header">
      <div class="header-top">
        <div class="header-title">FEONG的<span>咖啡馆</span>收藏集</div>
        <div class="header-meta">
          <div class="count" id="totalCount">—</div>
          <div>间咖啡馆</div>
        </div>
      </div>
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索咖啡馆名称、地区、分类..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear-btn" id="clearBtn" aria-label="清除搜索">✕</button>
      </div>
    </header>

    <!-- 主内容 -->
    <main class="main" id="mainContent">
      <!-- 加载骨架 -->
      <div id="loadingState">
        <div class="skeleton-row">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
        <div class="skeleton-row">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>
      </div>
      <!-- 动态内容 -->
      <div id="contentArea"></div>
    </main>

  </div>

  <script>
    // ============================================================
    // 配置
    // ============================================================
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
    const CORS_PROXY = 'https://corsproxy.io/?';
    const AUTO_REFRESH_INTERVAL = 5 * 60 * 1000; // 5分钟自动刷新
    const PREVIEW_COUNT = 5; // 每个分组默认显示卡片数

    // ============================================================
    // 状态
    // ============================================================
    let allCafes = [];
    let filteredCafes = [];
    let searchQuery = '';
    let expandedGroups = new Set();
    let refreshTimer = null;

    // ============================================================
    // 工具函数
    // ============================================================

    /** 转义 HTML */
    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /** 获取本地存储的收藏 / 已去过 ID 集合 */
    function getLocalSet(key) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? new Set(JSON.parse(raw)) : new Set();
      } catch { return new Set(); }
    }

    /** 保存本地集合 */
    function saveLocalSet(key, set) {
      try {
        localStorage.setItem(key, JSON.stringify([...set]));
      } catch (e) { /* 忽略存储满的错误 */ }
    }

    /** 生成咖啡馆唯一 ID */
    function getCafeId(cafe) {
      return `${cafe.name || ''}|${cafe.area || ''}|${cafe.link || ''}`;
    }

    // ============================================================
    // CSV 解析
    // ============================================================

    /** 简单 CSV 解析器（支持引号包裹的字段） */
    function parseCSV(text) {
      const lines = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (next === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            current += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            lines.push(current);
            current = '';
          } else if (char === '\n' || (char === '\r' && next === '\n')) {
            lines.push(current);
            current = '';
            if (char === '\r') i++;
          } else if (char === '\r') {
            lines.push(current);
            current = '';
          } else {
            current += char;
          }
        }
      }
      lines.push(current);

      // 将扁平数组重组为行
      const rows = [];
      let row = [];
      for (let i = 0; i < lines.length; i++) {
        // 每 6 个字段为一行（姓名、地区、小红书、分类、描述、收藏、已去过）
        // 但表头可能多于 6 列，动态判断
        row.push(lines[i].trim());
      }

      // 更稳健的方式：按行切分
      const rawLines = text.split(/\r?\n/).filter(l => l.trim());
      const result = [];
      let header = null;

      for (let i = 0; i < rawLines.length; i++) {
        const fields = parseCSVLine(rawLines[i]);
        if (i === 0) {
          header = fields.map(h => h.trim().toLowerCase());
        } else {
          const obj = {};
          header.forEach((h, idx) => {
            obj[h] = (fields[idx] || '').trim();
          });
          result.push(obj);
        }
      }
      return result;
    }

    /** 解析单行 CSV */
    function parseCSVLine(line) {
      const fields = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        const next = line[i + 1];

        if (inQuotes) {
          if (char === '"') {
            if (next === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = false;
            }
          } else {
            current += char;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            fields.push(current);
            current = '';
          } else {
            current += char;
          }
        }
      }
      fields.push(current);
      return fields;
    }

    // ============================================================
    // 数据获取
    // ============================================================

    async function fetchData() {
      showLoading(true);
      try {
        let text = '';
        // 优先使用 CORS 代理
        try {
          const resp = await fetch(CORS_PROXY + encodeURIComponent(CSV_URL));
          if (!resp.ok) throw new Error('Proxy response not ok');
          text = await resp.text();
        } catch (proxyErr) {
          // 回退到直接请求（如果 Google 允许）
          console.warn('代理请求失败，尝试直接请求...', proxyErr);
          const resp = await fetch(CSV_URL);
          if (!resp.ok) throw new Error('Direct fetch failed');
          text = await resp.text();
        }

        const rows = parseCSV(text);
        // 标准化字段名
        allCafes = rows.map(row => ({
          name: row['名字'] || row['name'] || row['cafe'] || row['咖啡馆'] || '',
          area: row['地区'] || row['area'] || row['location'] || row['区域'] || '',
          link: row['小红书链接'] || row['link'] || row['小红书'] || row['url'] || '',
          category: row['分类'] || row['category'] || row['type'] || row['类别'] || '',
          description: row['描述'] || row['description'] || row['desc'] || row['备注'] || '',
          favorite: row['收藏'] || row['favorite'] || '',
          visited: row['已去过'] || row['visited'] || row['去过'] || ''
        })).filter(c => c.name); // 过滤掉没有名字的空行

        // 合并本地标记
        const localFav = getLocalSet('feong_favorites');
        const localVisited = getLocalSet('feong_visited');
        allCafes.forEach(c => {
          const id = getCafeId(c);
          if (localFav.has(id)) c.favorite = '是';
          if (localVisited.has(id)) c.visited = '是';
        });

        updateTotalCount();
        applySearch();
        renderContent();

        // 更新时间显示
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        document.querySelector('.header-meta').innerHTML = `
          <div class="count">${allCafes.length}</div>
          <div>间咖啡馆 · ${timeStr}</div>
        `;

      } catch (err) {
        console.error('数据获取失败:', err);
        document.getElementById('contentArea').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <div class="title">数据加载失败</div>
            <div class="sub">请检查网络连接，或稍后下拉重试</div>
          </div>
        `;
      } finally {
        showLoading(false);
      }
    }

    function showLoading(show) {
      document.getElementById('loadingState').style.display = show ? 'block' : 'none';
      if (show) document.getElementById('contentArea').innerHTML = '';
    }

    function updateTotalCount() {
      const el = document.getElementById('totalCount');
      if (el) el.textContent = allCafes.length;
    }

    // ============================================================
    // 搜索
    // ============================================================

    function applySearch() {
      const q = searchQuery.trim().toLowerCase();
      if (!q) {
        filteredCafes = [...allCafes];
      } else {
        filteredCafes = allCafes.filter(c =>
          (c.name || '').toLowerCase().includes(q) ||
          (c.area || '').toLowerCase().includes(q) ||
          (c.category || '').toLowerCase().includes(q) ||
          (c.description || '').toLowerCase().includes(q)
        );
      }
    }

    // ============================================================
    // 内容渲染
    // ============================================================

    function renderContent() {
      const area = document.getElementById('contentArea');

      if (filteredCafes.length === 0 && searchQuery) {
        area.innerHTML = `
          <div class="no-results">
            <div class="icon">🔍</div>
            <div class="title">没有找到匹配的咖啡馆</div>
            <div class="sub">试试其他关键词</div>
          </div>
        `;
        return;
      }

      // ---- 提取分类 ----
      const categories = [...new Set(
        filteredCafes.map(c => c.category).filter(Boolean)
      )].sort((a, b) => {
        // "其它" / "其他" 排在最后
        const aOther = /^(其它|其他|other)$/i.test(a);
        const bOther = /^(其它|其他|other)$/i.test(b);
        if (aOther && !bOther) return 1;
        if (!aOther && bOther) return -1;
        return a.localeCompare(b, 'zh-CN');
      });

      // ---- 提取地区 ----
      const areas = [...new Set(
        filteredCafes.map(c => c.area).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, 'zh-CN'));

      // ---- 收藏 & 已去过 ----
      const favorites = filteredCafes.filter(c => c.favorite === '是' || c.favorite === 'yes' || c.favorite === 'true' || c.favorite === '1');
      const visited = filteredCafes.filter(c => c.visited === '是' || c.visited === 'yes' || c.visited === 'true' || c.visited === '1');

      // ---- 构建 HTML ----
      let html = '';

      // 1. 分类分组
      categories.forEach(cat => {
        const cafes = filteredCafes.filter(c => c.category === cat);
        if (cafes.length === 0) return;
        html += buildGroup(`分类 · ${cat}`, '📂', cafes, `cat-${cat}`, cat);
      });

      // 2. 地区分组
      areas.forEach(areaName => {
        const cafes = filteredCafes.filter(c => c.area === areaName);
        if (cafes.length === 0) return;
        html += buildGroup(`地区 · ${areaName}`, '📍', cafes, `area-${areaName}`, areaName);
      });

      // 3. 收藏分组
      if (favorites.length > 0) {
        html += buildGroup('我的收藏', '⭐', favorites, 'favorites', '收藏');
      }

      // 4. 已去过分组
      if (visited.length > 0) {
        html += buildGroup('已去过', '✅', visited, 'visited', '已去过');
      }

      area.innerHTML = html || `
        <div class="empty-state">
          <div class="icon">☕</div>
          <div class="title">还没有咖啡馆数据</div>
          <div class="sub">请在 Google Sheet 中添加数据</div>
        </div>
      `;

      // 绑定事件
      bindGroupEvents();
    }

    /** 构建单个分组 HTML */
    function buildGroup(title, icon, cafes, groupKey, subKey) {
      const isExpanded = expandedGroups.has(groupKey);
      const displayCafes = isExpanded ? cafes : cafes.slice(0, PREVIEW_COUNT);
      const hasMore = cafes.length > PREVIEW_COUNT;

      const cardsHtml = displayCafes.map(c => buildCard(c)).join('');

      return `
        <section class="group" data-group="${groupKey}">
          <div class="group-header">
            <div class="group-title">
              <span class="icon">${icon}</span>
              ${escapeHtml(title)}
              <span class="badge">${cafes.length}</span>
            </div>
            ${hasMore ? `<button class="group-toggle" data-group="${groupKey}">${isExpanded ? '收起' : '展开全部'}</button>` : ''}
          </div>
          <div class="scroll-row ${isExpanded ? 'expanded' : ''}" data-group="${groupKey}">
            ${cardsHtml}
          </div>
        </section>
      `;
    }

    /** 构建单张卡片 HTML */
    function buildCard(cafe) {
      const id = getCafeId(cafe);
      const isFav = cafe.favorite === '是' || cafe.favorite === 'yes' || cafe.favorite === 'true' || cafe.favorite === '1';
      const isVisited = cafe.visited === '是' || cafe.visited === 'yes' || cafe.visited === 'true' || cafe.visited === '1';

      // 生成 Google Maps 搜索链接
      const mapQuery = encodeURIComponent(cafe.name + (cafe.area ? ' ' + cafe.area : ''));
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

      // 小红书链接
      const xhsUrl = cafe.link || '';

      return `
        <div class="card" data-id="${escapeHtml(id)}" data-name="${escapeHtml(cafe.name)}" data-area="${escapeHtml(cafe.area)}">
          <div class="card-stripe"></div>
          <div class="card-body">
            <div class="card-name">${escapeHtml(cafe.name)}</div>
            <div class="card-tags">
              ${cafe.category ? `<span class="card-tag category">${escapeHtml(cafe.category)}</span>` : ''}
              ${cafe.area ? `<span class="card-tag">${escapeHtml(cafe.area)}</span>` : ''}
            </div>
            ${cafe.description ? `<div class="card-desc">${escapeHtml(cafe.description)}</div>` : ''}
            <div class="card-actions">
              <button class="card-action-btn fav-btn ${isFav ? 'active' : ''}" data-id="${escapeHtml(id)}" data-action="favorite">
                ${isFav ? '⭐' : '☆'} 收藏
              </button>
              <button class="card-action-btn visit-btn ${isVisited ? 'active' : ''}" data-id="${escapeHtml(id)}" data-action="visited">
                ${isVisited ? '✅' : '☐'} 去过
              </button>
              <a class="card-action-btn map-btn" href="${mapUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                🗺️ 导航
              </a>
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================
    // 事件绑定
    // ============================================================

    function bindGroupEvents() {
      // 展开 / 收起
      document.querySelectorAll('.group-toggle').forEach(btn => {
        btn.addEventListener('click', function () {
          const key = this.dataset.group;
          if (expandedGroups.has(key)) {
            expandedGroups.delete(key);
          } else {
            expandedGroups.add(key);
          }
          renderContent();
        });
      });

      // 卡片点击（如果有小红书链接，打开）
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function (e) {
          // 如果点击的是按钮或链接，不处理
          if (e.target.closest('.card-action-btn') || e.target.closest('.card-action-btn')) return;

          const id = this.dataset.id;
          const cafe = allCafes.find(c => getCafeId(c) === id);
          if (cafe && cafe.link) {
            window.open(cafe.link, '_blank', 'noopener');
          }
        });
      });

      // 收藏按钮
      document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const id = this.dataset.id;
          toggleFavorite(id);
        });
      });

      // 去过按钮
      document.querySelectorAll('.visit-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const id = this.dataset.id;
          toggleVisited(id);
        });
      });

      // 地图按钮阻止冒泡
      document.querySelectorAll('.map-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
        });
      });
    }

    // ============================================================
    // 收藏 / 已去过 切换
    // ============================================================

    function toggleFavorite(id) {
      const favSet = getLocalSet('feong_favorites');
      const cafe = allCafes.find(c => getCafeId(c) === id);
      if (!cafe) return;

      const isFav = favSet.has(id);
      if (isFav) {
        favSet.delete(id);
        cafe.favorite = '否';
      } else {
        favSet.add(id);
        cafe.favorite = '是';
      }
      saveLocalSet('feong_favorites', favSet);

      // 重新渲染
      applySearch();
      renderContent();
    }

    function toggleVisited(id) {
      const visitedSet = getLocalSet('feong_visited');
      const cafe = allCafes.find(c => getCafeId(c) === id);
      if (!cafe) return;

      const isVisited = visitedSet.has(id);
      if (isVisited) {
        visitedSet.delete(id);
        cafe.visited = '否';
      } else {
        visitedSet.add(id);
        cafe.visited = '是';
      }
      saveLocalSet('feong_visited', visitedSet);

      applySearch();
      renderContent();
    }

    // ============================================================
    // 搜索事件
    // ============================================================

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    searchInput.addEventListener('input', function () {
      searchQuery = this.value;
      clearBtn.classList.toggle('visible', this.value.length > 0);
      applySearch();
      renderContent();
    });

    clearBtn.addEventListener('click', function () {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.remove('visible');
      applySearch();
      renderContent();
      searchInput.focus();
    });

    // ============================================================
    // 下拉刷新
    // ============================================================

    (function initPullToRefresh() {
      const app = document.getElementById('app');
      const indicator = document.getElementById('pullIndicator');
      const pullText = document.getElementById('pullText');

      let startY = 0;
      let pulling = false;
      let currentY = 0;

      app.addEventListener('touchstart', function (e) {
        if (app.scrollTop <= 0) {
          startY = e.touches[0].clientY;
          pulling = true;
        }
      }, { passive: true });

      app.addEventListener('touchmove', function (e) {
        if (!pulling) return;
        currentY = e.touches[0].clientY;
        const diff = currentY - startY;

        if (diff > 0) {
          // 阻止默认滚动
          e.preventDefault();
          const pullDistance = Math.min(diff * 0.4, 120);

          if (pullDistance > 20) {
            indicator.classList.add('visible');
            indicator.style.transform = `translateY(${Math.min(pullDistance - 60, 20)}px)`;
          }

          if (pullDistance > 80) {
            pullText.textContent = '松手刷新';
          } else {
            pullText.textContent = '下拉刷新';
          }
        }
      }, { passive: false });

      app.addEventListener('touchend', function () {
        if (!pulling) return;
        pulling = false;

        const diff = currentY - startY;
        if (diff * 0.4 > 80) {
          // 触发刷新
          pullText.textContent = '正在刷新...';
          fetchData().finally(() => {
            setTimeout(() => {
              indicator.classList.remove('visible');
              indicator.style.transform = '';
              pullText.textContent = '下拉刷新';
            }, 500);
          });
        } else {
          indicator.classList.remove('visible');
          indicator.style.transform = '';
        }

        startY = 0;
        currentY = 0;
      });
    })();

    // ============================================================
    // 自动刷新
    // ============================================================

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        fetchData();
      }, AUTO_REFRESH_INTERVAL);
    }

    // ============================================================
    // 初始化
    // ============================================================

    (function init() {
      // 初始加载
      fetchData();
      startAutoRefresh();

      // 页面可见时刷新
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          // 页面回来时检查是否需要刷新
          fetchData();
        }
      });
    })();

  </script>
</body>
