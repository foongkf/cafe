<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏">
<meta name="theme-color" content="#f5f0eb">
<title>FEONG的咖啡馆收藏集</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root {
  --bg: #f5f0eb;
  --card-bg: #ffffff;
  --text: #2c2416;
  --text-muted: #8a7e70;
  --accent: #c4724e;
  --accent-light: #f0e0d6;
  --visited: #6b8f5e;
  --visited-bg: #eaf3e6;
  --shadow: 0 2px 8px rgba(44, 36, 22, 0.08);
  --shadow-hover: 0 4px 16px rgba(44, 36, 22, 0.12);
  --radius: 14px;
  --radius-sm: 8px;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
  overscroll-behavior-y: contain;
}
/* ===== 顶部栏 ===== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  padding: 16px 16px 8px;
  border-bottom: 1px solid rgba(44,36,22,0.06);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.header-title {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
  white-space: nowrap;
}
.header-title span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border: 1.5px solid rgba(44,36,22,0.12);
  background: var(--card-bg);
  color: var(--text);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 0.82rem;
  font-weight: 500;
  cursor: pointer;
  min-height: 40px;
  transition: all 0.2s ease;
  white-space: nowrap;
  font-family: inherit;
}
.btn:active { transform: scale(0.96); }
.btn-accent {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.btn-accent:active { background: #b0623e; }
.search-bar {
  position: relative;
  margin-bottom: 4px;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border: 1.5px solid rgba(44,36,22,0.1);
  border-radius: 24px;
  background: var(--card-bg);
  font-size: 0.9rem;
  color: var(--text);
  outline: none;
  font-family: inherit;
  transition: border-color 0.2s;
  min-height: 44px;
}
.search-bar input:focus { border-color: var(--accent); }
.search-bar input::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 1rem;
  pointer-events: none;
}
/* ===== 状态提示 ===== */
.status {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 0.9rem;
}
.status.error { color: #c0392b; }
.status .btn { margin-top: 12px; }
.spinner {
  display: inline-block;
  width: 24px; height: 24px;
  border: 2.5px solid rgba(196,114,78,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
/* ===== 内容区 ===== */
.content { padding: 8px 16px 32px; max-width: 1200px; margin: 0 auto; }
/* 地区折叠 */
.area-panel {
  margin-bottom: 14px;
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.area-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  font-weight: 600;
  font-size: 0.92rem;
}
.area-panel-header:active { background: rgba(196,114,78,0.05); }
.area-chevron {
  font-size: 0.75rem;
  color: var(--text-muted);
  transition: transform 0.3s ease;
}
.area-panel.open .area-chevron { transform: rotate(180deg); }
.area-panel-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.area-panel.open .area-panel-body { max-height: 2000px; }
.area-group { padding: 4px 16px 12px; }
.area-group-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
  margin-top: 8px;
}
.area-group-list { display: flex; flex-wrap: wrap; gap: 6px; }
.area-chip {
  display: inline-block;
  padding: 5px 12px;
  background: var(--accent-light);
  color: var(--text);
  border-radius: 16px;
  font-size: 0.78rem;
  cursor: pointer;
  border: none;
  font-family: inherit;
  transition: background 0.2s;
  min-height: 32px;
  line-height: 1.4;
}
.area-chip:active { background: #e0ccc0; }
/* ===== 分类分组 ===== */
.category-section { margin-bottom: 18px; }
.category-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 4px;
  cursor: pointer;
  user-select: none;
}
.category-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}
.category-count {
  font-size: 0.72rem;
  font-weight: 500;
  color: #fff;
  background: var(--accent);
  border-radius: 10px;
  padding: 1px 8px;
  min-width: 20px;
  text-align: center;
}
.category-chevron {
  font-size: 0.75rem;
  color: var(--text-muted);
  transition: transform 0.3s ease;
}
.category-section.open .category-chevron { transform: rotate(180deg); }
.category-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.category-section.open .category-body { max-height: 9999px; }
/* 折叠时的横向滑动 */
.cards-scroll {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  padding: 4px 4px 12px;
  scrollbar-width: none;
}
.cards-scroll::-webkit-scrollbar { display: none; }
.cards-scroll .card { scroll-snap-align: start; flex: 0 0 260px; }
/* 展开后的网格 */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
  padding: 4px 4px 12px;
}
/* ===== 资料卡 ===== */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: box-shadow 0.2s ease, transform 0.15s ease;
  position: relative;
  overflow: hidden;
}
.card:active { transform: scale(0.985); }
.card.visited { background: var(--visited-bg); }
.card.visited::after {
  content: "✓ 已去过";
  position: absolute;
  top: 10px;
  right: -24px;
  background: var(--visited);
  color: #fff;
  font-size: 0.65rem;
  font-weight: 600;
  padding: 3px 28px;
  transform: rotate(35deg);
  letter-spacing: 0.03em;
}
.card-name {
  font-size: 0.98rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
  padding-right: 40px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.card-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 0.7rem;
  font-weight: 500;
  background: var(--accent-light);
  color: var(--accent);
}
.card-area {
  font-size: 0.75rem;
  color: var(--text-muted);
}
.card-desc {
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 4px;
}
.card-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 0.75rem;
  font-weight: 500;
  border: 1.5px solid rgba(44,36,22,0.12);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
  min-height: 34px;
}
.card-btn:active { transform: scale(0.95); }
.card-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.card-btn.visited-active { border-color: var(--visited); color: var(--visited); background: var(--visited-bg); }
.card-xhs {
  text-decoration: none;
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
.card-xhs:active { background: var(--accent-light); }
/* 展开全部按钮 */
.expand-btn-wrap { text-align: center; padding: 4px 0 8px; }
.expand-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 7px 20px;
  border-radius: 18px;
  border: 1.5px dashed rgba(196,114,78,0.3);
  background: transparent;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
  min-height: 36px;
}
.expand-btn:active { background: var(--accent-light); }
.expand-btn .arrow { transition: transform 0.3s ease; }
.expand-btn.expanded .arrow { transform: rotate(180deg); }
/* 空状态 */
.empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
/* 下拉刷新指示器 */
.ptr-indicator {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  font-size: 0.82rem;
  font-weight: 500;
  background: var(--bg);
  z-index: 200;
  transform: translateY(-60px);
  transition: transform 0.2s ease;
  pointer-events: none;
}
.ptr-indicator.visible { transform: translateY(0); }
.ptr-indicator.refreshing { transform: translateY(0); }
/* 回到顶部 */
.back-top {
  position: fixed;
  bottom: 24px; right: 20px;
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(196,114,78,0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  transform: translateY(10px);
}
.back-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.back-top:active { transform: scale(0.9); }
/* ===== 响应式 ===== */
@media (max-width: 480px) {
  .content { padding: 6px 10px 28px; }
  .header { padding: 12px 10px 6px; }
  .header-title { font-size: 1rem; }
  .cards-scroll .card { flex: 0 0 240px; }
  .cards-grid { grid-template-columns: 1fr; gap: 10px; }
}
@media (min-width: 768px) {
  .cards-scroll .card { flex: 0 0 280px; }
  .header-title { font-size: 1.25rem; }
}
@media (min-width: 1024px) {
  .cards-scroll { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); overflow: visible; }
  .cards-scroll .card { flex: none; }
  .cards-scroll.hidden-overflow { display: none; }
  .cards-grid { display: grid; }
}
</style>
</head>
<body>

<!-- 下拉刷新指示器 -->
<div class="ptr-indicator" id="ptrIndicator">↓ 下拉刷新</div>

<!-- 顶部栏 -->
<header class="header">
  <div class="header-top">
    <div class="header-title">FEONG的<span>咖啡馆</span>收藏集</div>
    <div class="header-actions">
      <button class="btn" id="refreshBtn" title="刷新数据">↻</button>
      <button class="btn btn-accent" id="toggleAllBtn">全部展开</button>
    </div>
  </div>
  <div class="search-bar">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索咖啡馆名称、地区或描述…" autocomplete="off">
  </div>
</header>

<!-- 内容 -->
<main class="content" id="content">
  <div class="status" id="status">
    <div class="spinner"></div>
    <div>正在加载咖啡馆数据…</div>
  </div>
</main>

<!-- 回到顶部 -->
<button class="back-top" id="backTop" title="回到顶部">↑</button>

<script>
(function() {
  'use strict';

  // ===== 配置 =====
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';
  var LS_PREFIX = 'feong_cafe_';

  // ===== 状态 =====
  var allData = [];          // 全部咖啡馆数据
  var filteredData = [];     // 搜索过滤后的数据
  var searchQuery = '';
  var expandState = {};      // { categoryName: true/false } 每个分类的展开状态
  var globalExpanded = false;

  // ===== DOM =====
  var contentEl = document.getElementById('content');
  var statusEl = document.getElementById('status');
  var searchInput = document.getElementById('searchInput');
  var toggleAllBtn = document.getElementById('toggleAllBtn');
  var refreshBtn = document.getElementById('refreshBtn');
  var backTopBtn = document.getElementById('backTop');
  var ptrIndicator = document.getElementById('ptrIndicator');

  // ===== 工具函数 =====
  function getLS(key) {
    try { return localStorage.getItem(LS_PREFIX + key); } catch(e) { return null; }
  }
  function setLS(key, val) {
    try { localStorage.setItem(LS_PREFIX + key, val); } catch(e) {}
  }
  function escapeHtml(str) {
    if (!str) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }
  function makeId(name, area) {
    return (name || '') + '::' + (area || '');
  }

  // ===== 收藏 / 已去过 =====
  function isFavorite(id) { return getLS('fav_' + id) === '1'; }
  function isVisited(id) { return getLS('visited_' + id) === '1'; }
  function toggleFavorite(id) {
    setLS('fav_' + id, isFavorite(id) ? '0' : '1');
  }
  function toggleVisited(id) {
    setLS('visited_' + id, isVisited(id) ? '0' : '1');
  }

  // ===== 数据加载 =====
  function loadData() {
    statusEl.className = 'status';
    statusEl.innerHTML = '<div class="spinner"></div><div>正在加载咖啡馆数据…</div>';
    contentEl.innerHTML = '';

    var url = CSV_URL + '&t=' + Date.now();

    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        if (!results.data || results.data.length === 0) {
          showError('数据为空，请检查Google Sheet是否已发布。');
          return;
        }
        allData = results.data.map(function(row) {
          return {
            name: (row.name || '').trim(),
            area: (row.area || '').trim(),
            xhs_link: (row.xhs_link || '').trim(),
            category: (row.category || 'other').trim().toLowerCase(),
            description: (row.description || '').trim()
          };
        }).filter(function(item) { return item.name; });

        // 恢复展开状态
        try {
          var saved = getLS('expand_state');
          if (saved) expandState = JSON.parse(saved);
        } catch(e) {}

        globalExpanded = getLS('global_expanded') === '1';

        applySearch();
      },
      error: function() {
        showError('无法加载数据。请检查网络连接，或稍后重试。');
      }
    });
  }

  function showError(msg) {
    statusEl.className = 'status error';
    statusEl.innerHTML = '<div>' + escapeHtml(msg) + '</div><button class="btn btn-accent" onclick="location.reload()">重新加载</button>';
  }

  // ===== 搜索 =====
  function applySearch() {
    if (!searchQuery) {
      filteredData = allData.slice();
    } else {
      var q = searchQuery.toLowerCase();
      filteredData = allData.filter(function(item) {
        return (item.name && item.name.toLowerCase().indexOf(q) !== -1) ||
               (item.area && item.area.toLowerCase().indexOf(q) !== -1) ||
               (item.description && item.description.toLowerCase().indexOf(q) !== -1) ||
               (item.category && item.category.toLowerCase().indexOf(q) !== -1);
      });
    }
    render();
  }

  // ===== 渲染 =====
  function render() {
    if (filteredData.length === 0) {
      contentEl.innerHTML = '<div class="empty"><div class="empty-icon">☕</div><div>没有找到匹配的咖啡馆</div></div>';
      updateToggleAllBtn();
      return;
    }

    // 按category分组
    var groups = {};
    filteredData.forEach(function(item) {
      var cat = item.category || 'other';
      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(item);
    });

    // category字母排序
    var sortedCats = Object.keys(groups).sort(function(a, b) {
      return a.localeCompare(b);
    });

    var html = '';

    // ---- 按地区查找面板 ----
    html += renderAreaPanel();

    // ---- 分类分组 ----
    sortedCats.forEach(function(cat) {
      html += renderCategorySection(cat, groups[cat]);
    });

    contentEl.innerHTML = html;

    // 绑定事件
    bindEvents();

    // 恢复滚动位置（可选）
    updateToggleAllBtn();
  }

  function renderAreaPanel() {
    // 按地区分组
    var areaMap = {};
    allData.forEach(function(item) {
      var area = item.area || '未分类';
      if (!areaMap[area]) areaMap[area] = [];
      areaMap[area].push(item);
    });
    var sortedAreas = Object.keys(areaMap).sort(function(a, b) {
      return a.localeCompare(b);
    });

    if (sortedAreas.length <= 1 && sortedAreas[0] === '未分类') return '';

    var savedOpen = getLS('area_panel_open') === '1';

    var h = '<div class="area-panel' + (savedOpen ? ' open' : '') + '" id="areaPanel">';
    h += '<div class="area-panel-header" id="areaPanelHeader">';
    h += '<span>📍 按地区查找</span>';
    h += '<span class="area-chevron">▼</span>';
    h += '</div>';
    h += '<div class="area-panel-body">';

    sortedAreas.forEach(function(area) {
      h += '<div class="area-group">';
      h += '<div class="area-group-title">' + escapeHtml(area) + ' (' + areaMap[area].length + ')</div>';
      h += '<div class="area-group-list">';
      areaMap[area].forEach(function(item) {
        h += '<button class="area-chip" data-name="' + escapeHtml(item.name) + '" data-area="' + escapeHtml(item.area) + '">' + escapeHtml(item.name) + '</button>';
      });
      h += '</div></div>';
    });

    h += '</div></div>';
    return h;
  }

  function renderCategorySection(cat, items) {
    var isOpen = globalExpanded || expandState[cat] === true;
    var savedExpanded = getLS('cat_expanded_' + cat) === '1';
    if (!globalExpanded && expandState[cat] === undefined && savedExpanded) isOpen = true;

    var displayName = cat.charAt(0).toUpperCase() + cat.slice(1);

    var h = '<div class="category-section' + (isOpen ? ' open' : '') + '" data-category="' + escapeHtml(cat) + '">';
    h += '<div class="category-header" data-toggle="' + escapeHtml(cat) + '">';
    h += '<div class="category-name">' + escapeHtml(displayName) + ' <span class="category-count">' + items.length + '</span></div>';
    h += '<span class="category-chevron">▼</span>';
    h += '</div>';
    h += '<div class="category-body">';

    // 判断是否展开全部
    var showAll = isOpen && (globalExpanded || expandState[cat] === 'full');

    if (showAll) {
      // 网格布局显示全部
      h += '<div class="cards-grid">';
      items.forEach(function(item) {
        h += renderCard(item);
      });
      h += '</div>';
    } else {
      // 横向滑动，显示前8张
      var shown = items.slice(0, 8);
      h += '<div class="cards-scroll">';
      shown.forEach(function(item) {
        h += renderCard(item);
      });
      h += '</div>';

      if (items.length > 8) {
        h += '<div class="expand-btn-wrap">';
        h += '<button class="expand-btn" data-expand="' + escapeHtml(cat) + '">查看全部 ' + items.length + ' 家 <span class="arrow">▼</span></button>';
        h += '</div>';
      }
    }

    h += '</div></div>';
    return h;
  }

  function renderCard(item) {
    var id = makeId(item.name, item.area);
    var fav = isFavorite(id);
    var visited = isVisited(id);

    var h = '<div class="card' + (visited ? ' visited' : '') + '" data-card-id="' + escapeHtml(id) + '">';
    h += '<div class="card-name">' + escapeHtml(item.name) + '</div>';
    h += '<div class="card-meta">';
    h += '<span class="card-tag">' + escapeHtml(item.category) + '</span>';
    if (item.area) h += '<span class="card-area">📍 ' + escapeHtml(item.area) + '</span>';
    h += '</div>';
    if (item.description) {
      h += '<div class="card-desc">' + escapeHtml(item.description) + '</div>';
    }
    h += '<div class="card-actions">';
    h += '<button class="card-btn' + (fav ? ' active' : '') + '" data-fav="' + escapeHtml(id) + '">♥ 收藏</button>';
    h += '<button class="card-btn' + (visited ? ' visited-active' : '') + '" data-visited="' + escapeHtml(id) + '">✓ 已去过</button>';
    if (item.xhs_link) {
      h += '<a class="card-btn card-xhs" href="' + escapeHtml(item.xhs_link) + '" target="_blank" rel="noopener">小红书</a>';
    }
    h += '</div></div>';
    return h;
  }

  // ===== 事件绑定 =====
  function bindEvents() {
    // 分类展开/收缩
    contentEl.querySelectorAll('[data-toggle]').forEach(function(el) {
      el.addEventListener('click', function() {
        var cat = this.getAttribute('data-toggle');
        var section = this.closest('.category-section');
        var isOpen = section.classList.contains('open');

        if (isOpen) {
          section.classList.remove('open');
          expandState[cat] = false;
          setLS('cat_expanded_' + cat, '0');
        } else {
          section.classList.add('open');
          expandState[cat] = true;
          setLS('cat_expanded_' + cat, '1');
        }
        saveExpandState();
      });
    });

    // 查看全部按钮
    contentEl.querySelectorAll('[data-expand]').forEach(function(el) {
      el.addEventListener('click', function() {
        var cat = this.getAttribute('data-expand');
        expandState[cat] = 'full';
        setLS('cat_expanded_' + cat, '1');
        saveExpandState();
        render();
      });
    });

    // 收藏 / 已去过
    contentEl.querySelectorAll('[data-fav]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.getAttribute('data-fav');
        toggleFavorite(id);
        this.classList.toggle('active');
        // 更新卡片visited状态不影响
        var card = this.closest('.card');
        var visitedBtn = card.querySelector('[data-visited]');
        if (visitedBtn) {
          var vid = visitedBtn.getAttribute('data-visited');
          if (isVisited(vid)) card.classList.add('visited');
          else card.classList.remove('visited');
        }
      });
    });

    contentEl.querySelectorAll('[data-visited]').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var id = this.getAttribute('data-visited');
        toggleVisited(id);
        this.classList.toggle('visited-active');
        var card = this.closest('.card');
        if (isVisited(id)) card.classList.add('visited');
        else card.classList.remove('visited');
      });
    });

    // 地区面板
    var areaHeader = document.getElementById('areaPanelHeader');
    if (areaHeader) {
      areaHeader.addEventListener('click', function() {
        var panel = document.getElementById('areaPanel');
        panel.classList.toggle('open');
        setLS('area_panel_open', panel.classList.contains('open') ? '1' : '0');
      });
    }

    // 地区chip跳转
    contentEl.querySelectorAll('.area-chip').forEach(function(el) {
      el.addEventListener('click', function() {
        var name = this.getAttribute('data-name');
        var area = this.getAttribute('data-area');
        // 滚动到对应卡片
        var cards = contentEl.querySelectorAll('.card');
        for (var i = 0; i < cards.length; i++) {
          var cardName = cards[i].querySelector('.card-name');
          var cardArea = cards[i].querySelector('.card-area');
          if (cardName && cardName.textContent.trim() === name) {
            // 确保分类展开
            var section = cards[i].closest('.category-section');
            if (section && !section.classList.contains('open')) {
              var toggle = section.querySelector('[data-toggle]');
              if (toggle) toggle.click();
            }
            setTimeout(function() {
              cards[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
              cards[i].style.boxShadow = '0 0 0 3px rgba(196,114,78,0.5)';
              setTimeout(function() { cards[i].style.boxShadow = ''; }, 1500);
            }, 300);
            break;
          }
        }
      });
    });
  }

  function saveExpandState() {
    try { setLS('expand_state', JSON.stringify(expandState)); } catch(e) {}
  }

  function updateToggleAllBtn() {
    if (globalExpanded) {
      toggleAllBtn.textContent = '全部收缩';
    } else {
      toggleAllBtn.textContent = '全部展开';
    }
  }

  // ===== 全局展开/收缩 =====
  toggleAllBtn.addEventListener('click', function() {
    globalExpanded = !globalExpanded;
    setLS('global_expanded', globalExpanded ? '1' : '0');
    if (globalExpanded) {
      // 全部展开
      allData.forEach(function(item) {
        expandState[item.category] = true;
        setLS('cat_expanded_' + item.category, '1');
      });
    } else {
      // 全部收缩（仅收缩，不清除状态）
      expandState = {};
      saveExpandState();
    }
    render();
  });

  // ===== 搜索 =====
  var searchTimer;
  searchInput.addEventListener('input', function() {
    clearTimeout(searchTimer);
    var self = this;
    searchTimer = setTimeout(function() {
      searchQuery = self.value.trim();
      applySearch();
    }, 250);
  });

  // ===== 刷新按钮 =====
  refreshBtn.addEventListener('click', function() {
    this.style.transform = 'rotate(360deg)';
    var self = this;
    setTimeout(function() { self.style.transform = ''; }, 400);
    loadData();
  });

  // ===== 回到顶部 =====
  var scrollTimer;
  window.addEventListener('scroll', function() {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function() {
      if (window.scrollY > 400) backTopBtn.classList.add('show');
      else backTopBtn.classList.remove('show');
    }, 100);
  }, { passive: true });

  backTopBtn.addEventListener('click', function() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ===== PWA 下拉刷新 =====
  (function initPullToRefresh() {
    var startY = 0;
    var pulling = false;
    var threshold = 70;
    var currentY = 0;

    // 仅在standalone模式或触摸设备启用
    var isStandalone = window.navigator.standalone === true ||
                       window.matchMedia('(display-mode: standalone)').matches;

    document.addEventListener('touchstart', function(e) {
      if (window.scrollY > 5) return;
      if (e.touches.length !== 1) return;
      startY = e.touches[0].clientY;
      pulling = true;
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!pulling) return;
      currentY = e.touches[0].clientY;
      var diff = currentY - startY;
      if (diff > 10 && window.scrollY <= 0) {
        e.preventDefault();
        if (diff > threshold) {
          ptrIndicator.textContent = '↑ 松开刷新';
          ptrIndicator.classList.add('visible');
        } else {
          ptrIndicator.textContent = '↓ 下拉刷新';
          ptrIndicator.classList.add('visible');
        }
      }
    }, { passive: false });

    document.addEventListener('touchend', function() {
      if (!pulling) return;
      pulling = false;
      var diff = currentY - startY;
      if (diff > threshold && window.scrollY <= 0) {
        ptrIndicator.textContent = '正在刷新…';
        ptrIndicator.classList.add('refreshing');
        loadData();
        setTimeout(function() {
          ptrIndicator.classList.remove('visible', 'refreshing');
        }, 1200);
      } else {
        ptrIndicator.classList.remove('visible');
      }
      startY = 0;
      currentY = 0;
    }, { passive: true });
  })();

  // ===== 启动 =====
  loadData();

  // 监听online/offline
  window.addEventListener('online', function() {
    if (allData.length === 0) loadData();
  });

})();
</script>
