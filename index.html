<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="咖啡馆收藏集">
<meta name="description" content="FEONG的咖啡馆收藏集 · 我的私藏咖啡馆清单">
<title>FEONG的咖啡馆收藏集</title>
<style>
  :root{
    --bg:#faf7f2;
    --card:#ffffff;
    --text:#2c2320;
    --muted:#8a7a6d;
    --accent:#a8683c;
    --accent-soft:#f7ede4;
    --border:#ece1d6;
    --radius:16px;
    --fav:#e0574a;
    --vis:#4f6b4f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{overscroll-behavior-y:contain;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    line-height:1.5;
    min-height:100vh;
  }
  body.no-scroll{overflow:hidden;}

  /* ---------- 顶部 ---------- */
  .app-header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:12px;
    padding:14px 16px;
    padding-top:calc(14px + env(safe-area-inset-top));
    background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .app-header{
      background:rgba(250,247,242,.86);
      -webkit-backdrop-filter:saturate(180%) blur(14px);
      backdrop-filter:saturate(180%) blur(14px);
    }
  }
  .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .logo{font-size:24px;line-height:1;flex:0 0 auto;}
  .brand-text{min-width:0;}
  .brand-text h1{
    font-size:17px;font-weight:700;margin:0;letter-spacing:.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .sub{font-size:12px;color:var(--muted);margin:2px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hdr-btn{
    flex:0 0 auto;
    border:1px solid var(--border);background:#fff;color:var(--text);
    border-radius:11px;padding:9px 13px;font-size:13.5px;font-weight:500;
    font-family:inherit;cursor:pointer;transition:background .15s;
  }
  .hdr-btn:active{background:#f3ece5;}
  .hdr-btn.spin{opacity:.55;pointer-events:none;}

  /* ---------- 工具栏 ---------- */
  .toolbar{
    max-width:1200px;margin:0 auto;
    padding:14px 16px 4px;
    display:flex;flex-direction:column;gap:10px;
  }
  .row-search{display:flex;gap:10px;align-items:center;}
  .search{flex:1 1 auto;position:relative;display:flex;align-items:center;min-width:0;}
  .search .ico{position:absolute;left:13px;font-size:14px;opacity:.45;pointer-events:none;line-height:1;}
  .search input{
    width:100%;
    padding:11px 14px 11px 38px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#fff;
    font-size:15px;
    font-family:inherit;
    color:var(--text);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
    -webkit-appearance:none;
  }
  .search input::placeholder{color:#b6a698;}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .btn-random{
    flex:0 0 auto;
    padding:11px 17px;border-radius:12px;border:none;
    background:var(--accent);color:#fff;
    font-size:14.5px;font-weight:600;font-family:inherit;
    cursor:pointer;white-space:nowrap;
    transition:opacity .15s, transform .1s;
    box-shadow:0 2px 8px rgba(168,104,60,.22);
  }
  .btn-random:active{opacity:.86;transform:scale(.98);}

  .row-ctl{
    display:flex;gap:8px;align-items:center;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding-bottom:2px;
  }
  .row-ctl::-webkit-scrollbar{display:none;}
  .seg{
    display:inline-flex;flex:0 0 auto;
    background:#fff;border:1px solid var(--border);
    border-radius:999px;padding:2px;gap:2px;
  }
  .seg-btn{
    border:none;background:transparent;color:#6b5b4e;
    font-family:inherit;font-size:13px;font-weight:500;
    padding:6px 12px;border-radius:999px;line-height:1;
    cursor:pointer;white-space:nowrap;
    transition:background .15s, color .15s;
  }
  .seg-btn.active{background:var(--accent);color:#fff;}
  .seg-btn.active[data-filter="fav"]{background:var(--fav);}
  .seg-btn.active[data-filter="visited"]{background:var(--vis);}

  .pill-btn{
    flex:0 0 auto;
    padding:8px 14px;border-radius:999px;
    border:1px solid var(--border);
    background:#fff;color:#6b5b4e;
    font-size:13px;font-family:inherit;font-weight:500;
    cursor:pointer;white-space:nowrap;line-height:1;
    transition:background .15s, border-color .15s;
  }
  .pill-btn:active{background:#f3ece5;}

  /* ---------- 分组 ---------- */
  #content{
    max-width:1200px;margin:0 auto;
    padding:8px 0 28px;
    will-change:transform;
  }
  .group{margin-bottom:22px;}
  .group-head{
    display:flex;align-items:center;gap:10px;
    padding:0 16px;margin-bottom:9px;
  }
  .group-head h2{
    font-size:15.5px;font-weight:700;margin:0;
    display:flex;align-items:center;gap:7px;
    min-width:0;word-break:break-word;
  }
  .group-count{
    flex:0 0 auto;
    font-size:11.5px;font-weight:600;color:#8a5a34;
    background:var(--accent-soft);
    padding:3px 7px;border-radius:999px;line-height:1;
  }
  .group-toggle{
    margin-left:auto;flex:0 0 auto;
    border:1px solid var(--border);background:#fff;color:#6b5b4e;
    border-radius:999px;padding:5px 12px;
    font-size:12.5px;font-family:inherit;font-weight:500;
    cursor:pointer;line-height:1;
    transition:background .15s;
  }
  .group-toggle:active{background:#f3ece5;}

  .group-body{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    padding:6px 16px 12px;
  }
  .group-body::-webkit-scrollbar{display:none;}
  .group-body > .card{
    flex:0 0 264px;
    scroll-snap-align:start;
  }
  .group-body.expanded{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
    overflow:visible;
    scroll-snap-type:none;
    padding-bottom:12px;
  }

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:15px 16px 14px;
    display:flex;flex-direction:column;gap:9px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(90,60,35,.04);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s;
    -webkit-user-select:none;user-select:none;
  }
  @media (hover:hover){
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(120,80,50,.11);border-color:#e3d5c6;}
  }
  .card:active{transform:scale(.988);}
  .card-head{display:flex;align-items:flex-start;gap:6px;}
  .card-title{
    font-size:16px;font-weight:650;margin:0;
    line-height:1.35;letter-spacing:.1px;
    word-break:break-word;
    flex:1;min-width:0;
  }
  .card-marks{display:flex;gap:1px;flex:0 0 auto;margin-top:-2px;}
  .mark-btn{
    background:none;border:none;padding:0 2px;
    font-size:18px;line-height:1.15;
    cursor:pointer;font-family:inherit;
    color:#d9c9bb;
    transition:transform .14s, color .14s;
  }
  .mark-btn.vis{font-size:15px;font-weight:800;padding:0 3px;}
  .mark-btn:active{transform:scale(1.22);}
  .mark-btn.fav.on{color:var(--fav);}
  .mark-btn.vis.on{color:var(--vis);}

  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    display:inline-flex;align-items:center;gap:4px;
    font-size:12px;line-height:1;
    padding:5px 9px;border-radius:999px;
    white-space:nowrap;
  }
  .tag-area{background:#eef3ee;color:#4f6b4f;}
  .tag-cat{background:var(--accent-soft);color:#8a5a34;}
  .card-desc{
    margin:0;font-size:13.5px;line-height:1.6;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    word-break:break-word;
  }
  .pill-xhs{
    align-self:flex-start;
    font-size:12.5px;font-weight:600;
    color:var(--accent);
    background:var(--accent-soft);
    padding:6px 11px;border-radius:9px;
    text-decoration:none;
    transition:background .15s;
  }
  .pill-xhs:hover{background:#f0e0d2;}

  /* ---------- 状态 ---------- */
  .state{
    text-align:center;
    padding:64px 20px;
    color:var(--muted);
    font-size:15px;
    line-height:1.9;
  }
  .state .big{font-size:34px;display:block;margin-bottom:10px;}
  .state .small{font-size:13px;}
  .state-btn{
    margin-top:14px;
    padding:10px 22px;border-radius:11px;border:none;
    background:var(--accent);color:#fff;font-size:14.5px;font-weight:600;
    font-family:inherit;cursor:pointer;
  }
  .loading-dot{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--accent);margin-right:8px;
    animation:pulse 1s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:1;transform:scale(1.15);}}

  /* ---------- 底部 ---------- */
  .footer{
    text-align:center;
    padding:0 16px calc(34px + env(safe-area-inset-bottom));
    color:#b9aa9c;font-size:12.5px;line-height:1.7;
  }

  /* ---------- 回到顶部 ---------- */
  .to-top{
    position:fixed;
    right:16px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(168,104,60,.25);
    background:rgba(168,104,60,.82);
    color:#fff;font-size:19px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-family:inherit;
    box-shadow:0 4px 14px rgba(120,80,50,.24);
    opacity:0;pointer-events:none;
    transform:translateY(10px);
    transition:opacity .2s, transform .2s;
    z-index:45;
  }
  .to-top.show{opacity:1;pointer-events:auto;transform:translateY(0);}
  .to-top:active{background:rgba(168,104,60,1);}

  /* ---------- 下拉刷新指示器 ---------- */
  .ptr{
    position:fixed;
    top:calc(8px + env(safe-area-inset-top));
    left:50%;
    width:40px;height:40px;margin-left:-20px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--border);
    box-shadow:0 3px 14px rgba(120,80,50,.16);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    font-size:18px;line-height:1;
    z-index:60;
    pointer-events:none;
    opacity:0;
    transform:translateY(-56px);
    transition:transform .25s cubic-bezier(.2,.85,.3,1), opacity .2s;
  }
  .ptr.spinning #ptrIcon{animation:ptrSpin .8s linear infinite;}
  @keyframes ptrSpin{to{transform:rotate(360deg);}}

  /* ---------- 弹窗 ---------- */
  .modal{position:fixed;inset:0;z-index:100;display:none;}
  .modal.open{display:flex;align-items:flex-end;justify-content:center;}
  .modal-backdrop{
    position:absolute;inset:0;
    background:rgba(45,28,16,.48);
    animation:fadeIn .2s ease;
  }
  @supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .modal-backdrop{
      -webkit-backdrop-filter:blur(3px);
      backdrop-filter:blur(3px);
    }
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-panel{
    position:relative;
    width:100%;max-width:600px;
    background:#fffdfa;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    animation:slideUp .26s cubic-bezier(.2,.85,.3,1);
    box-shadow:0 -8px 40px rgba(60,35,15,.18);
  }
  @keyframes slideUp{from{transform:translateY(28px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  @media (min-width:700px){
    .modal.open{align-items:center;}
    .modal-panel{border-radius:20px;max-height:82vh;animation:popIn .22s ease;}
    @keyframes popIn{from{transform:scale(.96);opacity:.5;}to{transform:scale(1);opacity:1;}}
  }
  .m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .m-head-main{min-width:0;}
  .m-head h2{font-size:21px;font-weight:700;margin:0 0 9px;line-height:1.35;word-break:break-word;}
  .icon-btn{
    flex:0 0 auto;
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--border);background:#fff;color:#8a7a6d;
    font-size:15px;line-height:1;cursor:pointer;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:#f3ece5;}
  .m-desc{
    font-size:15px;line-height:1.8;color:#4e4239;
    margin:16px 0 0;
    white-space:pre-wrap;word-break:break-word;
  }
  .m-desc.muted{color:var(--muted);font-style:italic;}
  .m-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:13px 18px;border-radius:13px;
    font-size:15px;font-weight:600;font-family:inherit;
    border:1px solid transparent;cursor:pointer;text-decoration:none;
    flex:1 1 auto;min-width:120px;
    transition:opacity .15s, background .15s, color .15s, border-color .15s;
  }
  .btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 12px rgba(168,104,60,.25);}
  .btn-primary:active{opacity:.87;}
  .btn-ghost{background:#fff;border-color:var(--border);color:var(--text);}
  .btn-ghost:active{background:#f7f1ea;}
  .btn-ghost.fav.on{color:var(--fav);border-color:#f3cfca;background:#fdf3f2;}
  .btn-ghost.vis.on{color:var(--vis);border-color:#cfe0cf;background:#f0f6f0;}

  /* ---------- 移动端微调 ---------- */
  @media (max-width:520px){
    .brand-text h1{font-size:15.5px;}
    .logo{font-size:21px;}
    .hdr-btn{padding:8px 11px;font-size:13px;}
    .toolbar{padding:12px 12px 2px;}
    .app-header{padding-left:12px;padding-right:12px;}
    .btn-random{flex:1 1 100%;}
    .row-search{flex-wrap:wrap;}
    .search{flex:1 1 100%;}
    .group-head{padding:0 12px;}
    .group-body{padding-left:12px;padding-right:12px;}
    .group-body > .card{flex:0 0 78vw;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="logo">☕</span>
    <div class="brand-text">
      <h1>FEONG的咖啡馆收藏集</h1>
      <p class="sub" id="countText">正在载入…</p>
    </div>
  </div>
  <button class="hdr-btn" id="refreshBtn" type="button">↻ 刷新</button>
</header>

<div class="toolbar">
  <div class="row-search">
    <div class="search">
      <span class="ico">🔍</span>
      <input id="searchInput" type="search" placeholder="搜索名字、地区、分类或描述…" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="btn-random" id="randomBtn" type="button">🎲 随机挑一间</button>
  </div>
  <div class="row-ctl">
    <div class="seg" id="filterSeg">
      <button type="button" class="seg-btn active" data-filter="all">全部</button>
      <button type="button" class="seg-btn" data-filter="fav">❤ 收藏</button>
      <button type="button" class="seg-btn" data-filter="visited">✓ 去过</button>
    </div>
    <div class="seg" id="groupSeg">
      <button type="button" class="seg-btn active" data-group="cat">按分类</button>
      <button type="button" class="seg-btn" data-group="area">按地区</button>
    </div>
    <button type="button" class="pill-btn" id="expandAllBtn" data-expand="1">全部展开</button>
  </div>
</div>

<main id="content"></main>

<footer class="footer">
  数据来自 Google Sheet，打开页面即自动同步最新内容<br>
  © FEONG 的私人咖啡馆清单
</footer>

<button type="button" class="to-top" id="toTop" aria-label="回到顶部">↑</button>
<div class="ptr" id="ptr" aria-hidden="true"><span id="ptrIcon">↻</span></div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal-panel" id="modalPanel" role="dialog" aria-modal="true"></div>
</div>

<script>
(function () {
  'use strict';

  /* ================= 配置 ================= */
  var CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSMGavuFvvhx3l5G3oN_X_8QZsdfs6wg69dWw0WnkOIF6a6fJCXqgmgSYCLAkh94jI5sPQF-IZ5g_r6/pub?output=csv';

  // 直连失败时依次尝试的跨域代理
  var PROXIES = [
    function (u) { return u; },
    function (u) { return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function (u) { return 'https://corsproxy.io/?url=' + encodeURIComponent(u); }
  ];

  var FAV_KEY   = 'feong_cafe_favs_v1';
  var VIS_KEY   = 'feong_cafe_visited_v1';
  var CACHE_KEY = 'feong_cafe_cache_v1';
  var SESS_KEY  = 'feong_cafe_ui_v1';

  var PULL_THRESHOLD = 70;

  /* ================= 状态 ================= */
  var state = {
    all: [],
    view: [],
    q: '',
    filter: 'all',     // all | fav | visited
    group: 'cat',      // cat | area
    loading: false,
    error: '',
    offline: false,
    expanded: {}       // 以分组名作为键，记录展开态（仅内存，不持久化）
  };

  var favs = loadSet(FAV_KEY);
  var visited = loadSet(VIS_KEY);

  /* ================= DOM ================= */
  var contentEl   = document.getElementById('content');
  var countEl     = document.getElementById('countText');
  var searchEl    = document.getElementById('searchInput');
  var randomBtn   = document.getElementById('randomBtn');
  var refreshBtn  = document.getElementById('refreshBtn');
  var filterSeg   = document.getElementById('filterSeg');
  var groupSeg    = document.getElementById('groupSeg');
  var expandAllBtn= document.getElementById('expandAllBtn');
  var toTopBtn    = document.getElementById('toTop');
  var ptrEl       = document.getElementById('ptr');
  var ptrIcon     = document.getElementById('ptrIcon');
  var modalEl     = document.getElementById('modal');
  var modalPanel  = document.getElementById('modalPanel');

  /* ================= 通用工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function normalizeKey(s) {
    return String(s == null ? '' : s)
      .toLowerCase()
      .replace(/[\s\u3000_\-—–:：·.。/\\()（）\[\]]/g, '');
  }

  // 允许只填 www.xxx 或 xhslink.com/xxx
  function normalizeUrl(u) {
    u = String(u == null ? '' : u).trim();
    if (!u) return '';
    if (/^https?:\/\//i.test(u)) return u;
    if (/^(www\.|xhslink\.|xiaohongshu\.|m\.xiaohongshu\.)/i.test(u)) return 'https://' + u;
    if (/\.(com|cn|net|org|me|cc|link)\b/i.test(u)) return 'https://' + u;
    return '';
  }

  /* ================= localStorage / sessionStorage ================= */
  function loadSet(key) {
    try {
      var arr = JSON.parse(localStorage.getItem(key) || '[]');
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function saveSet(key, set) {
    try { localStorage.setItem(key, JSON.stringify(Array.from(set))); } catch (e) {}
  }
  function saveSession() {
    try {
      sessionStorage.setItem(SESS_KEY, JSON.stringify({ group: state.group, filter: state.filter }));
    } catch (e) {}
  }
  function restoreSession() {
    try {
      var o = JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null');
      if (!o) return;
      if (o.group === 'cat' || o.group === 'area') state.group = o.group;
      if (o.filter === 'all' || o.filter === 'fav' || o.filter === 'visited') state.filter = o.filter;
    } catch (e) {}
  }

  /* ================= CSV 解析 ================= */
  function parseCSV(text) {
    text = String(text || '').replace(/^\uFEFF/, '');
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQ = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') { inQ = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r') { /* 跳过 */ }
        else { field += c; }
      }
    }
    row.push(field);
    if (row.length > 1 || String(row[0]).trim() !== '') rows.push(row);
    return rows;
  }

  function findCol(headers, keys) {
    for (var i = 0; i < headers.length; i++) {
      for (var j = 0; j < keys.length; j++) {
        if (headers[i] === keys[j] || headers[i].indexOf(keys[j]) !== -1) return i;
      }
    }
    return -1;
  }

  // 有表头就按别名匹配，没有就按固定列序：名字|地区|链接|分类|描述
  function buildItems(rows) {
    if (!rows || !rows.length) return [];

    var firstRowText = rows[0].join('|').toLowerCase();
    var headerWords = ['名字','名称','店名','地区','区域','分类','类别','描述','简介','小红书','链接',
                       'name','area','location','category','description','desc','url','link','note','remark'];
    var hasHeader = false;
    for (var w = 0; w < headerWords.length; w++) {
      if (firstRowText.indexOf(headerWords[w]) !== -1) { hasHeader = true; break; }
    }

    var DEF = { name: 0, area: 1, url: 2, cat: 3, desc: 4 };
    var col, dataRows;

    if (hasHeader) {
      var h = rows[0].map(normalizeKey);
      col = {
        name: findCol(h, ['名字','名称','店名','cafe名','name','title']),
        area: findCol(h, ['地区','区域','地点','位置','area','location','region','district']),
        url:  findCol(h, ['小红书链接','小红书','链接','网址','xhs','xiaohongshu','link','url']),
        cat:  findCol(h, ['分类','类别','类型','category','type','tag']),
        desc: findCol(h, ['描述','简介','介绍','备注','说明','description','desc','note','remark'])
      };
      for (var k in DEF) { if (col[k] < 0) col[k] = DEF[k]; }
      dataRows = rows.slice(1);
    } else {
      col = DEF;
      dataRows = rows;
    }

    var items = [];
    dataRows.forEach(function (r) {
      var get = function (idx) {
        return (idx >= 0 && idx < r.length) ? String(r[idx] == null ? '' : r[idx]).trim() : '';
      };
      var name = get(col.name);
      if (!name) return;

      var area = get(col.area);
      var category = get(col.cat) || '其它';

      items.push({
        id: (name + '|' + area).toLowerCase(),
        name: name,
        area: area,
        category: category,
        desc: get(col.desc),
        url: normalizeUrl(get(col.url))
      });
    });

    return items;
  }

  /* ================= 网络请求 ================= */
  function fetchWithTimeout(url, ms) {
    return new Promise(function (resolve, reject) {
      var timer = setTimeout(function () { reject(new Error('请求超时')); }, ms);
      fetch(url, { cache: 'no-store', redirect: 'follow' })
        .then(function (res) { clearTimeout(timer); resolve(res); })
        .catch(function (err) { clearTimeout(timer); reject(err); });
    });
  }

  function fetchCSVText() {
    var lastErr = null;
    var chain = Promise.reject();

    PROXIES.forEach(function (make) {
      chain = chain.catch(function () {
        return fetchWithTimeout(make(CSV_URL), 15000).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        }).then(function (text) {
          if (!text || text.trim().length < 5) throw new Error('返回内容为空');
          if (text.trim().charAt(0) === '<') throw new Error('返回的不是 CSV 数据');
          return text;
        }).catch(function (err) {
          lastErr = err;
          throw err;
        });
      });
    });

    return chain.catch(function () {
      throw new Error((lastErr && lastErr.message) ? lastErr.message : '网络请求失败');
    });
  }

  /* ================= 筛选 / 分组 ================= */
  function filterItems() {
    var q = state.q.trim().toLowerCase();
    return state.all.filter(function (it) {
      if (state.filter === 'fav' && !favs.has(it.id)) return false;
      if (state.filter === 'visited' && !visited.has(it.id)) return false;
      if (q) {
        var hay = (it.name + ' ' + it.area + ' ' + it.category + ' ' + it.desc).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function isTrailingGroup(name) {
    return name === '其它' || name === '未标注地区';
  }

  function sortGroupNames(a, b) {
    var la = isTrailingGroup(a), lb = isTrailingGroup(b);
    if (la !== lb) return la ? 1 : -1;
    return a.toLowerCase().localeCompare(b.toLowerCase(), 'en', { numeric: true, sensitivity: 'base' });
  }

  function buildGroups(items) {
    var map = Object.create(null);
    var names = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var name = state.group === 'cat'
        ? (it.category || '其它')
        : (it.area || '未标注地区');
      if (!map[name]) { map[name] = []; names.push(name); }
      map[name].push(it);
    }
    names.sort(sortGroupNames);
    return names.map(function (n) { return { name: n, items: map[n] }; });
  }

  /* ================= 渲染 ================= */
  function cardHTML(it) {
    var isFav = favs.has(it.id);
    var isVis = visited.has(it.id);

    var h = '<article class="card" data-id="' + esc(it.id) + '">';

    h += '<div class="card-head">';
    h += '<h3 class="card-title">' + esc(it.name) + '</h3>';
    h += '<div class="card-marks">';
    h += '<button type="button" class="mark-btn fav' + (isFav ? ' on' : '') +
         '" data-fav="' + esc(it.id) + '" aria-label="收藏">' + (isFav ? '♥' : '♡') + '</button>';
    h += '<button type="button" class="mark-btn vis' + (isVis ? ' on' : '') +
         '" data-vis="' + esc(it.id) + '" aria-label="已去过">✓</button>';
    h += '</div></div>';

    if (it.area || it.category) {
      h += '<div class="tags">';
      if (it.area) h += '<span class="tag tag-area">📍 ' + esc(it.area) + '</span>';
      if (it.category) h += '<span class="tag tag-cat">' + esc(it.category) + '</span>';
      h += '</div>';
    }

    if (it.desc) h += '<p class="card-desc">' + esc(it.desc) + '</p>';
    if (it.url) {
      h += '<a class="pill-xhs" href="' + esc(it.url) +
           '" target="_blank" rel="noopener noreferrer">小红书 ↗</a>';
    }

    h += '</article>';
    return h;
  }

  function groupHTML(g) {
    var key = g.name;
    var expanded = !!state.expanded[key];

    var h = '<section class="group" data-key="' + esc(key) + '">';
    h += '<header class="group-head">';
    h += '<h2>' + esc(g.name) + '<span class="group-count">' + g.items.length + '</span></h2>';
    h += '<button type="button" class="group-toggle" aria-expanded="' + (expanded ? 'true' : 'false') + '">' +
         (expanded ? '收起' : '展开') + '</button>';
    h += '</header>';
    h += '<div class="group-body' + (expanded ? ' expanded' : '') + '">';
    for (var i = 0; i < g.items.length; i++) h += cardHTML(g.items[i]);
    h += '</div></section>';
    return h;
  }

  function render() {
    if (state.loading && !state.all.length) {
      contentEl.innerHTML = '<div class="state"><span class="loading-dot"></span>正在读取咖啡馆收藏…</div>';
      updateCount();
      return;
    }

    if (state.error && !state.all.length) {
      contentEl.innerHTML =
        '<div class="state"><span class="big">😵</span>读取失败：' + esc(state.error) +
        '<br><span class="small">请检查网络，或确认 Google Sheet 已发布为 CSV</span>' +
        '<br><button type="button" class="state-btn" data-retry="1">重新加载</button></div>';
      updateCount();
      return;
    }

    state.view = filterItems();

    if (!state.view.length) {
      var msg;
      if (!state.all.length) msg = '表格里还没有数据';
      else if (state.filter === 'fav') msg = '你还没有收藏任何咖啡馆';
      else if (state.filter === 'visited') msg = '还没有标记过去过的咖啡馆';
      else if (state.q) msg = '没有找到符合条件的咖啡馆 🥲';
      else msg = '还没有任何记录';
      contentEl.innerHTML = '<div class="state"><span class="big">☕</span>' + esc(msg) + '</div>';
      updateCount();
      return;
    }

    var groups = buildGroups(state.view);
    var html = '';
    for (var i = 0; i < groups.length; i++) html += groupHTML(groups[i]);
    contentEl.innerHTML = html;

    updateExpandAllBtn();
    updateCount();
  }

  function updateCount() {
    if (state.loading && !state.all.length) { countEl.textContent = '正在载入…'; return; }
    if (state.error && !state.all.length) { countEl.textContent = '载入失败'; return; }

    var txt = '共 ' + state.all.length + ' 间 · ♥ ' + favs.size + ' · ✓ ' + visited.size;
    if (state.offline) txt += ' · 离线数据';
    countEl.textContent = txt;
  }

  /* ================= 展开 / 收起 ================= */
  function updateExpandAllBtn() {
    var secs = contentEl.querySelectorAll('.group');
    var allExpanded = secs.length > 0;
    for (var i = 0; i < secs.length; i++) {
      var body = secs[i].querySelector('.group-body');
      if (!body || !body.classList.contains('expanded')) { allExpanded = false; break; }
    }
    expandAllBtn.textContent = allExpanded ? '全部收起' : '全部展开';
    expandAllBtn.setAttribute('data-expand', allExpanded ? '0' : '1');
  }

  function setAllExpanded(expand) {
    var secs = contentEl.querySelectorAll('.group');
    for (var i = 0; i < secs.length; i++) {
      var key = secs[i].getAttribute('data-key');
      var body = secs[i].querySelector('.group-body');
      var btn = secs[i].querySelector('.group-toggle');
      body.classList.toggle('expanded', expand);
      btn.setAttribute('aria-expanded', expand ? 'true' : 'false');
      btn.textContent = expand ? '收起' : '展开';
      if (expand) state.expanded[key] = true; else delete state.expanded[key];
    }
    updateExpandAllBtn();
  }

  function toggleGroup(btn) {
    var sec = btn.closest('.group');
    if (!sec) return;
    var key = sec.getAttribute('data-key');
    var body = sec.querySelector('.group-body');
    var expand = !body.classList.contains('expanded');

    body.classList.toggle('expanded', expand);
    btn.setAttribute('aria-expanded', expand ? 'true' : 'false');
    btn.textContent = expand ? '收起' : '展开';

    if (expand) state.expanded[key] = true; else delete state.expanded[key];
    updateExpandAllBtn();
  }

  /* ================= 收藏 / 已去过 ================= */
  // 就地更新所有指向同一 id 的按钮，避免整页重渲染丢失滚动位置
  function syncMarks(id) {
    var isFav = favs.has(id);
    var isVis = visited.has(id);
    var els = contentEl.querySelectorAll('[data-fav],[data-vis]');
    var i, el;

    for (i = 0; i < els.length; i++) {
      el = els[i];
      if (el.getAttribute('data-fav') === id) {
        el.classList.toggle('on', isFav);
        el.textContent = isFav ? '♥' : '♡';
      }
    }

    var mEls = modalPanel.querySelectorAll('[data-fav],[data-vis]');
    for (i = 0; i < mEls.length; i++) {
      el = mEls[i];
      if (el.getAttribute('data-fav') === id) {
        el.classList.toggle('on', isFav);
        el.textContent = isFav ? '♥ 已收藏' : '♡ 收藏';
      }
      if (el.getAttribute('data-vis') === id) {
        el.classList.toggle('on', isVis);
        el.textContent = isVis ? '✓ 去过了' : '✓ 已去过';
      }
    }
  }

  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveSet(FAV_KEY, favs);

    // 「收藏」筛选下取消收藏会让卡片消失，必须整页重渲染
    if (state.filter === 'fav') render();
    syncMarks(id);
    updateCount();
  }

  function toggleVisited(id) {
    if (visited.has(id)) visited.delete(id); else visited.add(id);
    saveSet(VIS_KEY, visited);

    if (state.filter === 'visited') render();
    syncMarks(id);
    updateCount();
  }

  /* ================= 弹窗 ================= */
  function modalHTML(it) {
    var isFav = favs.has(it.id);
    var isVis = visited.has(it.id);

    var h = '<div class="m-head"><div class="m-head-main">';
    h += '<h2>' + esc(it.name) + '</h2>';
    if (it.area || it.category) {
      h += '<div class="tags">';
      if (it.area) h += '<span class="tag tag-area">📍 ' + esc(it.area) + '</span>';
      if (it.category) h += '<span class="tag tag-cat">' + esc(it.category) + '</span>';
      h += '</div>';
    }
    h += '</div>';
    h += '<button type="button" class="icon-btn" data-close="1" aria-label="关闭">✕</button></div>';

    h += it.desc
      ? '<p class="m-desc">' + esc(it.desc) + '</p>'
      : '<p class="m-desc muted">暂无描述</p>';

    h += '<div class="m-actions">';
    if (it.url) {
      h += '<a class="btn btn-primary" href="' + esc(it.url) +
           '" target="_blank" rel="noopener noreferrer">在小红书查看 ↗</a>';
    }
    h += '<button type="button" class="btn btn-ghost fav' + (isFav ? ' on' : '') +
         '" data-fav="' + esc(it.id) + '">' + (isFav ? '♥ 已收藏' : '♡ 收藏') + '</button>';
    h += '<button type="button" class="btn btn-ghost vis' + (isVis ? ' on' : '') +
         '" data-vis="' + esc(it.id) + '">' + (isVis ? '✓ 去过了' : '✓ 已去过') + '</button>';
    h += '</div>';

    return h;
  }

  function openModal(id) {
    var it = null;
    for (var i = 0; i < state.all.length; i++) {
      if (state.all[i].id === id) { it = state.all[i]; break; }
    }
    if (!it) return;

    modalPanel.innerHTML = modalHTML(it);
    modalEl.classList.add('open');
    modalEl.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    modalPanel.scrollTop = 0;
  }

  function closeModal() {
    modalEl.classList.remove('open');
    modalEl.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
  }

  /* ================= 触摸：横向滑动防误触 ================= */
  var swipeState = null;
  var swallowClick = false;

  contentEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { swipeState = null; return; }
    swipeState = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false };
  }, { passive: true });

  contentEl.addEventListener('touchmove', function (e) {
    if (!swipeState || e.touches.length !== 1) return;
    var dx = Math.abs(e.touches[0].clientX - swipeState.x);
    var dy = Math.abs(e.touches[0].clientY - swipeState.y);
    if (dx > 10 || dy > 10) swipeState.moved = true;
  }, { passive: true });

  contentEl.addEventListener('touchend', function () {
    if (swipeState && swipeState.moved) {
      swallowClick = true;
      setTimeout(function () { swallowClick = false; }, 400);
    }
    swipeState = null;
  }, { passive: true });

  /* ================= 下拉刷新 ================= */
  var pull = { active: false, startY: 0, dist: 0, tracking: false };

  function applyPull(d) {
    contentEl.style.transition = 'none';
    contentEl.style.transform = 'translateY(' + d + 'px)';
    ptrEl.style.transition = 'none';
    ptrEl.style.opacity = String(Math.min(d / PULL_THRESHOLD, 1));
    ptrEl.style.transform = 'translateY(' + (d - 56) + 'px)';
    ptrIcon.style.transform = 'rotate(' + (d * 4) + 'deg)';
  }

  function endPull(doRefresh) {
    var ease = '.25s cubic-bezier(.2,.85,.3,1)';
    pull.tracking = false;
    pull.dist = 0;
    ptrIcon.style.transform = '';

    if (doRefresh) {
      contentEl.style.transition = 'transform ' + ease;
      contentEl.style.transform = 'translateY(46px)';
      ptrEl.style.transition = 'transform ' + ease;
      ptrEl.style.transform = 'translateY(10px)';
      ptrEl.style.opacity = '1';
      ptrEl.classList.add('spinning');

      load().then(function () {
        contentEl.style.transform = '';
        ptrEl.style.transition = 'transform ' + ease + ', opacity .2s';
        ptrEl.style.transform = 'translateY(-56px)';
        ptrEl.style.opacity = '0';
        ptrEl.classList.remove('spinning');
      });
    } else {
      contentEl.style.transition = 'transform ' + ease;
      contentEl.style.transform = '';
      ptrEl.style.transition = 'transform ' + ease + ', opacity .2s';
      ptrEl.style.transform = 'translateY(-56px)';
      ptrEl.style.opacity = '0';
      ptrEl.classList.remove('spinning');
    }
  }

  window.addEventListener('touchstart', function (e) {
    if (modalEl.classList.contains('open')) return;
    if (window.scrollY > 0) return;
    if (e.touches.length !== 1) return;
    pull.active = true;
    pull.tracking = false;
    pull.startY = e.touches[0].clientY;
    pull.dist = 0;
  }, { passive: true });

  // 需要 preventDefault 阻止橡皮筋，所以 passive:false
  window.addEventListener('touchmove', function (e) {
    if (!pull.active) return;
    if (e.touches.length !== 1) { pull.active = false; return; }

    var d = e.touches[0].clientY - pull.startY;

    if (d <= 0) {
      if (pull.tracking) endPull(false);
      pull.active = false;
      return;
    }
    if (window.scrollY > 0) { pull.active = false; return; }

    var move = Math.min(d * 0.5, 110);
    pull.dist = move;
    pull.tracking = true;

    if (move > 4) {
      e.preventDefault();
      applyPull(move);
    }
  }, { passive: false });

  window.addEventListener('touchend', function () {
    if (!pull.tracking) { pull.active = false; return; }
    pull.active = false;
    endPull(pull.dist >= PULL_THRESHOLD);
  }, { passive: true });

  /* ================= 数据加载 ================= */
  function load() {
    state.loading = true;
    state.error = '';
    refreshBtn.classList.add('spin');
    refreshBtn.textContent = '↻ 同步中';
    if (!state.all.length) render();

    return fetchCSVText().then(function (text) {
      state.all = buildItems(parseCSV(text));
      state.offline = false;
      state.loading = false;
      try { localStorage.setItem(CACHE_KEY, text); } catch (e) {}
      render();
    }).catch(function (err) {
      state.loading = false;
      state.error = (err && err.message) ? err.message : '未知错误';
      render();
    }).then(function () {
      refreshBtn.classList.remove('spin');
      refreshBtn.textContent = '↻ 刷新';
    });
  }

  /* ================= 分段控件 ================= */
  function syncSegUI() {
    var fBtns = filterSeg.querySelectorAll('[data-filter]');
    for (var i = 0; i < fBtns.length; i++) {
      fBtns[i].classList.toggle('active', fBtns[i].getAttribute('data-filter') === state.filter);
    }
    var gBtns = groupSeg.querySelectorAll('[data-group]');
    for (var j = 0; j < gBtns.length; j++) {
      gBtns[j].classList.toggle('active', gBtns[j].getAttribute('data-group') === state.group);
    }
  }

  filterSeg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-filter]') : null;
    if (!b) return;
    var v = b.getAttribute('data-filter');
    if (v === state.filter) return;
    state.filter = v;
    syncSegUI();
    saveSession();
    render();
  });

  groupSeg.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-group]') : null;
    if (!b) return;
    var v = b.getAttribute('data-group');
    if (v === state.group) return;
    state.group = v;
    state.expanded = {};   // 切换分组方式时全部重置为收起
    syncSegUI();
    saveSession();
    render();
  });

  expandAllBtn.addEventListener('click', function () {
    setAllExpanded(expandAllBtn.getAttribute('data-expand') === '1');
  });

  /* ================= 内容区事件委托 ================= */
  contentEl.addEventListener('click', function (e) {
    if (swallowClick) { swallowClick = false; return; }

    var t = e.target;

    var mark = t.closest ? t.closest('[data-fav]') : null;
    if (mark) { e.preventDefault(); e.stopPropagation(); toggleFav(mark.getAttribute('data-fav')); return; }

    var vis = t.closest ? t.closest('[data-vis]') : null;
    if (vis) { e.preventDefault(); e.stopPropagation(); toggleVisited(vis.getAttribute('data-vis')); return; }

    var tog = t.closest ? t.closest('.group-toggle') : null;
    if (tog) { toggleGroup(tog); return; }

    if (t.closest && t.closest('a')) return;   // 链接正常跳转

    var retry = t.closest ? t.closest('[data-retry]') : null;
    if (retry) { load(); return; }

    var card = t.closest ? t.closest('.card') : null;
    if (card) openModal(card.getAttribute('data-id'));
  });

  /* ================= 弹窗事件 ================= */
  modalEl.addEventListener('click', function (e) {
    var t = e.target;

    if (t.closest && t.closest('[data-close]')) { closeModal(); return; }

    var mark = t.closest ? t.closest('[data-fav]') : null;
    if (mark) { e.preventDefault(); toggleFav(mark.getAttribute('data-fav')); return; }

    var vis = t.closest ? t.closest('[data-vis]') : null;
    if (vis) { e.preventDefault(); toggleVisited(vis.getAttribute('data-vis')); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') closeModal();
  });

  /* ================= 搜索（180ms 防抖） ================= */
  var searchTimer = null;
  searchEl.addEventListener('input', function () {
    var val = searchEl.value;
    if (searchTimer) clearTimeout(searchTimer);
    searchTimer = setTimeout(function () {
      state.q = val;
      render();
    }, 180);
  });

  /* ================= 随机 ================= */
  randomBtn.addEventListener('click', function () {
    if (!state.view.length) {
      if (state.loading) return;
      alert('目前没有可挑选的咖啡馆～');
      return;
    }
    // 优先挑没去过的；都去过了就在全部结果里挑
    var pool = state.view.filter(function (it) { return !visited.has(it.id); });
    if (!pool.length) pool = state.view;
    var pick = pool[Math.floor(Math.random() * pool.length)];
    openModal(pick.id);
  });

  /* ================= 刷新按钮 ================= */
  refreshBtn.addEventListener('click', function () { load(); });

  /* ================= 回到顶部 ================= */
  window.addEventListener('scroll', function () {
    toTopBtn.classList.toggle('show', window.scrollY > 400);
  }, { passive: true });

  toTopBtn.addEventListener('click', function () {
    if ('scrollBehavior' in document.documentElement.style) {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      window.scrollTo(0, 0);
    }
  });

  /* ================= 页面重新可见时自动同步（超过 5 分钟） ================= */
  var lastLoad = Date.now();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - lastLoad > 5 * 60 * 1000 && !state.loading) {
      lastLoad = Date.now();
      load();
    }
  });

  /* ================= PWA manifest（失败静默跳过） ================= */
  (function injectManifest() {
    try {
      var manifest = {
        name: 'FEONG的咖啡馆收藏集',
        short_name: '咖啡馆收藏集',
        start_url: '.',
        display: 'standalone',
        background_color: '#faf7f2',
        theme_color: '#faf7f2'
      };
      var url = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
      var link = document.createElement('link');
      link.rel = 'manifest';
      link.href = url;
      document.head.appendChild(link);
    } catch (e) { /* 不支持就忽略 */ }
  })();

  /* ================= 启动 ================= */
  function boot() {
    restoreSession();
    syncSegUI();

    // 先用离线缓存立刻渲染，再后台拉最新数据
    try {
      var cached = localStorage.getItem(CACHE_KEY);
      if (cached) {
        state.all = buildItems(parseCSV(cached));
        state.offline = true;
      }
    } catch (e) { state.all = []; }

    render();
    load();
  }

  boot();
})();
</script>
</body>
</html>
